# =============================================================================
# PRE-COMMIT CONFIGURATION - solt-pre-commit repository
# =============================================================================

repos:
  # ─────────────────────────────────────────────────────────────────────────
  # PYTHON CODE QUALITY - scripts/lint.sh (ruff check + ruff format --check)
  # Calls the script directly instead of reimplementing its ruff invocation
  # via astral-sh/ruff-pre-commit's hooks - that split into two independent
  # definitions of "lint" that had already drifted apart in two ways: this
  # hook ran bare `ruff check` with no `--ignore E501`, unlike the script,
  # and ran no format check at all, so `ruff format` violations (like the
  # one that broke CI on hotfix/main-coverage - odoo_test_runner.py:256)
  # were only ever caught by CI, never locally, despite the script's own
  # header claiming otherwise. One invocation path now; can't drift again.
  # ─────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: solt-pre-commit-lint
        name: Solt Pre-commit - Lint & Format (scripts/lint.sh)
        entry: scripts/lint.sh
        language: system
        types: [ python ]
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────────────────
  # GENERAL CODE QUALITY
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: end-of-file-fixer
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ --maxkb=500 ]
      - id: debug-statements

ci:
  autofix_prs: false
  autoupdate_schedule: weekly
