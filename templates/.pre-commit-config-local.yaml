# =============================================================================
# PRE-COMMIT CONFIGURATION - For repos in soltein-4.0 monorepo
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files
# =============================================================================

# Lets a plain `pre-commit install` (no --hook-type flag) install both the
# pre-commit AND pre-push git hooks in one shot - required for
# solt-test-changed-modules below to actually run on push.
default_install_hook_types: [ pre-commit, pre-push ]

repos:
  # ─────────────────────────────────────────────────────────────────────────
  # SOLT PRE-COMMIT HOOKS (local path for monorepo)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # Kept here on purpose, unlike templates/.pre-commit-config.yaml (the
      # standalone-repo variant): standalone repos rely solely on the
      # PR-level auto-close check in solt-validate.yml, but monorepo
      # submodule repos also get this immediate local commit-time gate for
      # faster feedback during day-to-day development - redundant with the
      # PR-level check, not a leftover.
      # language: system (not python) is required for repo:local - "python"
      # makes pre-commit build a throwaway, isolated venv per hook with only
      # additional_dependencies installed, which never has solt_pre_commit
      # itself. "system" skips venv creation and runs `entry` directly
      # against the ambient environment - i.e. the editable install
      # (pip3 install -e ./solt-pre-commit) these hooks depend on.
      - id: solt-check-branch
        name: Soltein - Validate Branch Name
        entry: python -m solt_pre_commit.checks_branch_name
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-commit, pre-push ]

      - id: solt-check-odoo
        name: Soltein - Validate Odoo Module
        entry: python -m solt_pre_commit.checks_odoo_module
        language: system
        files: (__manifest__|__openerp__)\.py$
        pass_filenames: true
        types: [ python ]

      - id: solt-check-requirements
        name: Soltein - Verify requirements.txt matches manifests
        entry: python -m solt_pre_commit.checks_requirements
        language: system
        files: (__manifest__|__openerp__)\.py$
        pass_filenames: false
        require_serial: true

      - id: solt-test-changed-modules
        name: Soltein - Test Changed Modules
        # Runs Odoo tests for modules changed vs. the base branch - only
        # when the current branch has an open PR (fails open otherwise).
        # Configure via .solt-hooks.yaml: test_odoo_bin, test_odoo_conf,
        # test_db_*, test_http_port/test_gevent_port, test_require_open_pr.
        entry: python -m solt_pre_commit.checks_test_changed_modules
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-push ]

  # ─────────────────────────────────────────────────────────────────────────
  # PYTHON CODE QUALITY - Ruff (linter only, NO autofix, NO formatter)
  # Uses configuration from pyproject.toml
  # Note: Ruff is INFORMATIONAL - does not block commits/PRs
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [ --no-fix, --output-format=concise ]
        # Removed: --fix (no autofix)
        # Removed: ruff-format hook (no auto-formatting)

  # ─────────────────────────────────────────────────────────────────────────
  # ODOO-SPECIFIC LINTING (OCA) - BLOCKING with fail-on-warnings
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.0
    hooks:
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc

    # ─────────────────────────────────────────────────────────────────────────
  # GENERAL CODE QUALITY
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: end-of-file-fixer
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ --maxkb=500 ]
      - id: debug-statements

# =============================================================================
# CI CONFIGURATION
# =============================================================================
ci:
  autofix_prs: false
  autoupdate_schedule: weekly
