# =============================================================================
# SOLT PRE-COMMIT - Client Repository Workflow (Auto-Generated)
# =============================================================================
# This workflow is auto-generated by setup-repo.py and runs on Pull Requests,
# plus a full-scope pass on push to '{{ ODOO_VERSION }}' (post-merge). It
# performs linting, testing, and updates badges.
#
# ⚠️  DO NOT MANUALLY EDIT THIS FILE
# Run: python setup-repo.py --regenerate to update
#
# SETUP REQUIRED IN REPOSITORY SECRETS:
# - GIST_SECRET: Fine-grained PAT for updating badges (Gist write access)
# - SOLT_CROSS_REPO_TOKEN: (if sibling-repos exist) PAT for cross-repo checkout
# =============================================================================

name: Soltein Validation

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, master, develop, '17.0', '18.0', '19.0' ]
  # Post-merge full-scope run: Validation/Test/Badges below all switch to
  # 'full' scope on this trigger (see their own scope inputs) - this repo's
  # modules get exercised in full exactly once per merge instead of once per
  # PR push, and the coverage/lint badges get refreshed from an authoritative
  # whole-repo run instead of whatever subset the last PR's scope=changed
  # narrowed down to. No consumer beyond the badges today - purely
  # informational, doesn't gate anything (see the non-blocking notes below).
  push:
    branches: [ '{{ ODOO_VERSION }}' ]
  # Weekly badge updates
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 6 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # LINT - Code quality, branch naming, field attributes, docstrings
  # Runs on Pull Requests, and again full-scope on push to '{{ ODOO_VERSION }}' (post-merge)
  # ---------------------------------------------------------------------------
  Validation:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-validate.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      # 'full' on push (post-merge - lint the whole repo, not just one PR's
      # diff), 'changed' on pull_request (fast per-PR feedback). Validation is
      # cheap (seconds), so re-running it full-scope on every merge costs
      # nothing meaningful and is what keeps the Badges job below fed with
      # real solt-check/pylint/ruff numbers on push instead of stale ones.
      validation-scope: ${{ github.event_name == 'push' && 'full' || 'changed' }}
      # Blocking on pull_request (unchanged - this is the real per-PR gate), non-blocking on
      # push. 'full' scope on push checks every file in every module, not just one PR's diff -
      # a repo can easily carry pre-existing warnings across modules that pull_request's
      # scope=changed never touches. Left blocking there, the very first push-triggered run
      # would turn this branch's CI permanently red over pre-existing debt that PR never
      # introduced - contradicting this job's own "purely informational, doesn't gate anything"
      # design (see soltein-net/solt-llm#110's discussion, where this was first hit and fixed).
      # Badges still gets the real counts either way - GITHUB_OUTPUT is written by earlier
      # steps, before the (now-skipped-on-push) blocking gate would run.
      fail-on-warnings: ${{ github.event_name == 'pull_request' }}
      pylint-blocking: ${{ github.event_name == 'pull_request' }}
      ruff-blocking: false
      show-info: false

  # ---------------------------------------------------------------------------
  # TEST - Run Odoo module tests with coverage
  # Runs on Pull Requests (scope=changed) and on push to '{{ ODOO_VERSION }}'
  # post-merge (scope=full), after Validation passes
  # Note: Requires modules and sibling-repos to be auto-detected from manifests
  # If tests fail, this job fails and blocks the PR
  #
  # needs: Validation is deliberate: Validation is cheap (seconds) and already blocks merge
  # on its own, so a PR that fails Validation can never merge regardless of Test's
  # result. Running the far more expensive Test job (DB setup, sibling-repo
  # checkouts, coverage across every module) in parallel with a doomed Validation
  # run wastes CI minutes on every validation failure. Serializing costs green PRs
  # Validation's runtime (seconds) in added wall-clock latency, in exchange for
  # skipping all of Test's runtime (minutes) whenever Validation fails - a clear net
  # win given Validation failures are common during iterative development. If Validation
  # is skipped or fails, Test is automatically skipped too (default GitHub
  # Actions behavior for a job whose `needs` didn't succeed) - no separate
  # `if` needed here for that.
  # ---------------------------------------------------------------------------
  Test:
    needs: Validation
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
      # 'changed' on pull_request (most PRs only touch a handful of this
      # repo's modules - see soltein-net/solt-pre-commit#36 for the
      # narrowing/fallback/skip logic); 'full' on push (post-merge - one
      # authoritative whole-repo run per merge instead of per PR-push, feeding
      # the coverage badge a real full-repo number instead of whatever subset
      # the last PR happened to touch).
      scope: ${{ github.event_name == 'push' && 'full' || 'changed' }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # BADGES - Report Validation and Test results to Gist badges
  # Runs after Validation and Test (whether they passed or failed), on both
  # pull_request and push - on push this reports the full-scope post-merge
  # run's real numbers, not defaults (Validation also runs full-scope on
  # push, so solt-check-errors/pylint-changed/ruff-changed below are always
  # genuinely computed this run, never a stale or default value).
  # ---------------------------------------------------------------------------
  Badges:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: [ Validation, Test ]
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-check-badges.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      solt-check-errors: ${{ needs.Validation.outputs.errors-count }}
      pylint-changed: ${{ needs.Validation.outputs.pylint-changed }}
      pylint-blocking: true
      ruff-changed: ${{ needs.Validation.outputs.ruff-changed }}
      ruff-blocking: false
      test-result: ${{ needs.Test.outputs.test-result }}
      coverage-pct: ${{ needs.Test.outputs.coverage-pct }}
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

  # ---------------------------------------------------------------------------
  # WEEKLY DOCSTRING COVERAGE - Refresh docstring coverage badge on schedule
  # Runs independently on Mondays
  # ---------------------------------------------------------------------------
  Update-Docstrings-Badges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-badges.yml@{{ SOLT_VERSION }}
    with:
      gist-id: ${{ vars.SOLTEIN_GIST_ID }}
      badge-filename-prefix: ${{ github.event.repository.name }}
      docstring-threshold: 80
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
