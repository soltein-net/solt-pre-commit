# =============================================================================
# SOLT PRE-COMMIT - Client Repository Workflow (Auto-Generated)
# =============================================================================
# This workflow is auto-generated by setup-repo.py and runs on Pull Requests,
# plus a nightly full-scope pass (see NightlyTest below - not on every push;
# see its own comment for why). It performs linting, testing, and updates
# badges.
#
# ⚠️  DO NOT MANUALLY EDIT THIS FILE
# Run: python setup-repo.py --regenerate to update
#
# SETUP REQUIRED IN REPOSITORY SECRETS:
# - GIST_SECRET: Fine-grained PAT for updating badges (Gist write access)
# - SOLT_CROSS_REPO_TOKEN: (if sibling-repos exist) PAT for cross-repo checkout
# =============================================================================

name: Soltein Validation

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, master, develop, '17.0', '18.0', '19.0' ]
  # Validation (lint-only, seconds) still runs full-scope on every push, and
  # Badges still refreshes the solt-check/pylint/ruff badges from it - both
  # are cheap regardless of merge volume. NightlyTest (the actual Odoo test
  # run) does NOT run here anymore - see its own comment below for why.
  push:
    branches: [ '{{ ODOO_VERSION }}' ]
  schedule:
    # Weekly docstring-coverage badge update.
    - cron: '0 6 * * 1'  # Mondays at 6 AM UTC
    # Nightly full-scope Odoo test run - see NightlyTest below for why this
    # replaced "on every push to {{ ODOO_VERSION }}".
    - cron: '0 4 * * *'  # Daily at 4 AM UTC
  workflow_dispatch:

concurrency:
  # push groups by commit SHA, not ref - every push to the same branch has a
  # different SHA, so this group is always unique and cancel-in-progress
  # never actually cancels anything for push. Originally deliberate to
  # protect a post-merge full-scope test run (this repo's own real incident:
  # sharing ref-scoped groups with pull_request meant every full-scope run
  # raced the *next* merge and usually lost, cancelled before ever
  # completing - a 3+ hour solt-suite run cancelled this way by an unrelated
  # merge). That expensive job (now NightlyTest) no longer runs on push at
  # all - see its own comment - so this SHA-uniqueness mostly just means each
  # push's own cheap Validation/Badges pair (seconds each) always completes
  # independently, which is harmless. Left as-is rather than reverting to
  # ref-scoped: the commit-timestamp ordering guard on Badges' gist write
  # (see that job's own comment) already makes out-of-order completion safe
  # regardless of concurrency grouping, so there's no correctness reason to
  # change this, only a marginal one (cancelling a handful of redundant
  # seconds-long Validation runs during a merge burst isn't worth touching a
  # previously-incident-driven setting for). pull_request keeps its
  # ref-scoped group unchanged - cancelling a
  # stale run in favor of a newer push to the SAME PR is exactly what you
  # want during iterative development.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # LINT - Code quality, branch naming, field attributes, docstrings
  # Runs on Pull Requests, on push to '{{ ODOO_VERSION }}' (post-merge, lint
  # only), and on the nightly schedule (to gate NightlyTest below - see its
  # own comment).
  # ---------------------------------------------------------------------------
  Validation:
    if: |
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-validate.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      # 'full' on push (post-merge - lint the whole repo, not just one PR's
      # diff) and on the nightly schedule, 'changed' on pull_request (fast
      # per-PR feedback). Validation is cheap (seconds), so re-running it
      # full-scope on every merge costs nothing meaningful and is what keeps
      # the Badges job below fed with real solt-check/pylint/ruff numbers on
      # push instead of stale ones.
      validation-scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
      # Blocking on pull_request (unchanged - this is the real per-PR gate), non-blocking on
      # push. 'full' scope on push checks every file in every module, not just one PR's diff -
      # a repo can easily carry pre-existing warnings across modules that pull_request's
      # scope=changed never touches. Left blocking there, the very first push-triggered run
      # would turn this branch's CI permanently red over pre-existing debt that PR never
      # introduced - contradicting this job's own "purely informational, doesn't gate anything"
      # design (see soltein-net/solt-llm#110's discussion, where this was first hit and fixed).
      # Badges still gets the real counts either way - GITHUB_OUTPUT is written by earlier
      # steps, before the (now-skipped-on-push) blocking gate would run.
      fail-on-warnings: ${{ github.event_name == 'pull_request' }}
      pylint-blocking: ${{ github.event_name == 'pull_request' }}
      ruff-blocking: false
      show-info: false

  # ---------------------------------------------------------------------------
  # TEST - Run Odoo module tests with coverage (pull_request only)
  # Note: Requires modules and sibling-repos to be auto-detected from manifests
  # If tests fail, this job fails and blocks the PR
  #
  # needs: Validation is deliberate: Validation is cheap (seconds) and already blocks merge
  # on its own, so a PR that fails Validation can never merge regardless of Test's
  # result. Running the far more expensive Test job (DB setup, sibling-repo
  # checkouts, coverage across every module) in parallel with a doomed Validation
  # run wastes CI minutes on every validation failure. Serializing costs green PRs
  # Validation's runtime (seconds) in added wall-clock latency, in exchange for
  # skipping all of Test's runtime (minutes) whenever Validation fails - a clear net
  # win given Validation failures are common during iterative development. If Validation
  # is skipped or fails, Test is automatically skipped too (default GitHub
  # Actions behavior for a job whose `needs` didn't succeed) - no separate
  # `if` needed here for that.
  #
  # This job is pull_request-only on purpose - see NightlyTest below for why
  # push/nightly don't just reuse this one with a wider `if:`.
  # ---------------------------------------------------------------------------
  Test:
    needs: Validation
    if: github.event_name == 'pull_request'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
      # 'changed' - most PRs only touch a handful of this repo's modules -
      # see soltein-net/solt-pre-commit#36 for the narrowing/fallback/skip logic.
      scope: 'changed'
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # NIGHTLY TEST - Run Odoo module tests with coverage, full scope, once a
  # day - NOT on every push anymore.
  #
  # Used to run on every push to '{{ ODOO_VERSION }}' (as TestPostMerge). That
  # was fine at low merge volume, but this job's own cost is fixed regardless
  # of how the wall-clock is split (shards trade wall-clock for parallel job
  # count, not for total billed minutes - each shard still pays its own
  # checkout/install overhead): a 148-module repo's full suite bills roughly
  # 200-220 minutes *every time it runs*, sharded or not. At a sustained
  # ~10-20 merges/day (this repo's real pace, not a hypothetical), that is
  # 30,000-95,000+ minutes/month from this one job alone - 10-30x a typical
  # 3,000-minute/month plan allowance, confirmed against this org's real
  # billing usage. Sharding fixed the wall-clock/stuck-job problem; it never
  # could have fixed this, because the problem was never the shape of one
  # run - it was running the whole suite once per merge at all. Nightly runs
  # it once regardless of how many merges land that day, which is the actual
  # fix: same signal (does {{ ODOO_VERSION }} pass, with real coverage
  # numbers), a small, predictable, and bounded fraction of the previous
  # cost.
  #
  # needs: [ Validation ] + if: always() - same reasoning as before: needed
  # only to read Validation's errors-count output for skip-if-errors below,
  # never as a `.result`/success()/failure() check on this job's own
  # scheduling (see https://github.com/orgs/community/discussions/189172 and
  # https://github.com/orgs/community/discussions/72708 for the confirmed
  # failure mode that rules that out). github.event.schedule distinguishes
  # this cron from the weekly docstring one below - both are 'schedule'
  # events.
  # ---------------------------------------------------------------------------
  NightlyGate:
    # A quiet night (nothing merged to {{ ODOO_VERSION }} since yesterday's
    # run) has nothing new to test - the previous night's result is still
    # entirely accurate, so there's no reason to spend ~200+ minutes
    # re-confirming it. This is the actual point of "nightly, not per-push":
    # cost now scales with days that had at least one merge, not with merge
    # count or with the calendar. "25 hours ago", not 24 - a 1-hour overlap
    # margin against cron drift or a late-starting runner, so a commit that
    # lands right at the boundary is never missed.
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    outputs:
      has-new-commits: ${{ steps.check.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '{{ ODOO_VERSION }}'
          fetch-depth: 0
      - id: check
        run: |
          COUNT=$(git log --since="25 hours ago" --oneline | wc -l)
          echo "Found $COUNT commit(s) to {{ ODOO_VERSION }} in the last 25 hours"
          if [ "$COUNT" -gt 0 ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  NightlyTest:
    needs: [ Validation, NightlyGate ]
    if: |
      always() && github.event_name == 'schedule' && github.event.schedule == '0 4 * * *' &&
      needs.NightlyGate.outputs.has-new-commits == 'true'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
      # 'full' - one authoritative whole-repo run per night instead of per
      # merge, feeding the coverage badge a real full-repo number instead of
      # whatever subset the last PR happened to touch.
      scope: 'full'
      # Splits this full-scope run's modules across N parallel shards (see
      # solt-coverage.yml's own `shards` input for the partitioning logic) -
      # '1' (no sharding) unless this repo's own setup-repo.py regenerate
      # call chose otherwise (see detect_current_shards() - regenerating
      # preserves whatever value is already here instead of silently
      # resetting it back to '1').
      shards: '{{ SHARDS }}'
      # Skip the multi-hour Coverage run outright when Validation already
      # found real errors on this exact commit - see that input's own
      # description in solt-coverage.yml. Combine reports 'skipped' (not a
      # fabricated pass) in that case, which Badges below renders as a
      # neutral "not verified", not a stale or wrong pass/fail.
      skip-if-errors: ${{ needs.Validation.outputs.errors-count }}
      # github.ref on a schedule event is always this repo's *default*
      # branch, not necessarily '{{ ODOO_VERSION }}' - see checkout-ref's own
      # description in solt-coverage.yml for why an explicit override is
      # required here specifically (and only here - Test above must NOT set
      # this, or it would test the base branch instead of the PR's own
      # changes).
      checkout-ref: '{{ ODOO_VERSION }}'
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # BADGES - Report Validation and Test results to Gist badges
  # push only - these badges are keyed by branch (e.g. solt-suite-19.0-tests),
  # not by PR/branch-of-origin, so they're meant to answer "does 19.0 itself
  # currently pass" for anyone glancing at the README, not "did this one PR's
  # own diff pass". A developer's own PR/branch status is already fully
  # visible in the PR's own Checks list - it doesn't need a badge.
  #
  # Previously also ran on pull_request, on the theory that Validation runs
  # full-scope on push so the numbers would always be genuine there - true,
  # but Test still runs scope='changed' on a PR (only the modules that PR's
  # diff touched), and every open PR against the same base branch writes to
  # the exact same badge file. Whichever PR's own narrow, near-always-passing
  # result finished last silently overwrote the real branch state from the
  # last actual merge - confirmed live on soltein-net/solt-suite: the
  # post-merge run on 19.0 correctly found real failures and set the tests
  # badge to failing, then an unrelated PR's own passing (but irrelevant)
  # scope='changed' result clobbered it back to passing minutes later.
  #
  # Runs after Validation, Test, and NightlyTest (whether they passed, failed,
  # or were skipped) - on push AND on the nightly schedule, but the nightly
  # branch additionally requires needs.NightlyGate.outputs.has-new-commits:
  # on a quiet night (nothing merged since the last run - see NightlyGate's
  # own comment), skip this too, rather than spend a run re-publishing
  # yesterday's still-accurate numbers. (Two distinct signals now: push
  # refreshes the cheap solt-check/pylint/ruff badges from that commit's
  # full-scope Validation; the nightly run additionally refreshes
  # tests/coverage from NightlyTest, which only runs then.) Test never runs
  # outside pull_request, and NightlyTest never runs outside the nightly
  # schedule, so on any given trigger at most one of the two `||`
  # fallbacks below is ever non-empty - kept as `||` rather than switched to
  # just one side so a future caller reintroducing a pull_request path here
  # doesn't have to remember to change this too. A plain push (no nightly run
  # this trigger) leaves NightlyTest's output empty, which
  # solt-update-check-badges.yml already treats as "don't touch this badge" -
  # the tests/coverage badge simply keeps showing the last nightly result
  # until the next one, rather than being fabricated or blanked on every
  # push.
  #
  # NightlyTest's own output is sometimes the literal string 'skipped'
  # (Coverage was gated off by validation errors, see NightlyTest's own with:
  # block) - solt-update-check-badges.yml renders that as a distinct grey
  # "not verified" badge, never as a fabricated pass or a silently stale
  # previous value.
  #
  # commit-timestamp guards against a real race: push doesn't cancel a prior
  # push's own run (see this file's own concurrency block below), so an
  # older commit's run can finish - and write this same badge - *after* a
  # newer commit's run already did. github.event.head_commit only exists on
  # push - schedule events have no commit of their own, so this falls back to
  # this run's own start time, which is still monotonically useful for
  # ordering against another schedule run (there is normally only one per
  # night, but workflow_dispatch or a delayed retry could still overlap).
  # ---------------------------------------------------------------------------
  Badges:
    if: |
      always() && (github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *' &&
      needs.NightlyGate.outputs.has-new-commits == 'true'))
    needs: [ Validation, Test, NightlyTest, NightlyGate ]
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-check-badges.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      solt-check-errors: ${{ needs.Validation.outputs.errors-count }}
      pylint-changed: ${{ needs.Validation.outputs.pylint-changed }}
      pylint-blocking: true
      ruff-changed: ${{ needs.Validation.outputs.ruff-changed }}
      ruff-blocking: false
      test-result: ${{ needs.Test.outputs.test-result || needs.NightlyTest.outputs.test-result }}
      coverage-pct: ${{ needs.Test.outputs.coverage-pct || needs.NightlyTest.outputs.coverage-pct }}
      commit-timestamp: ${{ github.event.head_commit.timestamp || github.run_started_at }}
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

  # ---------------------------------------------------------------------------
  # WEEKLY DOCSTRING COVERAGE - Refresh docstring coverage badge on schedule
  # Runs independently on Mondays. Scoped to its own cron string, not just
  # any 'schedule' event - there are two now (see NightlyTest above), and
  # this one must not also fire on the nightly one.
  # ---------------------------------------------------------------------------
  Update-Docstrings-Badges:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      github.event_name == 'workflow_dispatch'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-badges.yml@{{ SOLT_VERSION }}
    with:
      gist-id: ${{ vars.SOLTEIN_GIST_ID }}
      badge-filename-prefix: ${{ github.event.repository.name }}
      docstring-threshold: 80
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
