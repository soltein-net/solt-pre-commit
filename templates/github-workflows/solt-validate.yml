# =============================================================================
# SOLT PRE-COMMIT - Client Repository Workflow (Auto-Generated)
# =============================================================================
# This workflow is auto-generated by setup-repo.py and runs on Pull Requests.
# It performs linting, testing, and updates badges.
#
# ⚠️  DO NOT MANUALLY EDIT THIS FILE
# Run: python setup-repo.py --regenerate to update
#
# SETUP REQUIRED IN REPOSITORY SECRETS:
# - GIST_SECRET: Fine-grained PAT for updating badges (Gist write access)
# - SOLT_CROSS_REPO_TOKEN: (if sibling-repos exist) PAT for cross-repo checkout
# =============================================================================

name: Soltein Validation

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, master, develop, '17.0', '18.0', '19.0' ]
  # Weekly badge updates
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 6 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # LINT - Code quality, branch naming, field attributes, docstrings
  # Runs on Pull Requests only
  # ---------------------------------------------------------------------------
  Lint:
    if: github.event_name == 'pull_request'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-validate.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      validation-scope: 'changed'
      fail-on-warnings: true
      pylint-blocking: true
      ruff-blocking: false
      show-info: false

  # ---------------------------------------------------------------------------
  # TEST - Run Odoo module tests with coverage
  # Runs on Pull Requests only
  # Note: Requires modules and sibling-repos to be auto-detected from manifests
  # If tests fail, this job fails and blocks the PR
  # ---------------------------------------------------------------------------
  Test:
    if: github.event_name == 'pull_request'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # BADGES - Report Lint and Test results to Gist badges
  # Runs after Lint and Test (whether they passed or failed)
  # ---------------------------------------------------------------------------
  Badges:
    if: always() && github.event_name == 'pull_request'
    needs: [ Lint, Test ]
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-check-badges.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      solt-check-errors: ${{ needs.Lint.outputs.errors-count }}
      pylint-changed: ${{ needs.Lint.outputs.pylint-changed }}
      pylint-blocking: true
      ruff-changed: ${{ needs.Lint.outputs.ruff-changed }}
      ruff-blocking: false
      test-result: ${{ needs.Test.outputs.test-result }}
      coverage-pct: ${{ needs.Test.outputs.coverage-pct }}
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

  # ---------------------------------------------------------------------------
  # WEEKLY DOCSTRING COVERAGE - Refresh docstring coverage badge on schedule
  # Runs independently on Mondays
  # ---------------------------------------------------------------------------
  Update-Docstrings-Badges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-badges.yml@{{ SOLT_VERSION }}
    with:
      gist-id: ${{ vars.SOLTEIN_GIST_ID }}
      badge-filename-prefix: ${{ github.event.repository.name }}
      docstring-threshold: 80
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
