# =============================================================================
# SOLT PRE-COMMIT - Client Repository Workflow (Auto-Generated)
# =============================================================================
# This workflow is auto-generated by setup-repo.py and runs on Pull Requests,
# plus a full-scope pass on push to '{{ ODOO_VERSION }}' (post-merge). It
# performs linting, testing, and updates badges.
#
# ⚠️  DO NOT MANUALLY EDIT THIS FILE
# Run: python setup-repo.py --regenerate to update
#
# SETUP REQUIRED IN REPOSITORY SECRETS:
# - GIST_SECRET: Fine-grained PAT for updating badges (Gist write access)
# - SOLT_CROSS_REPO_TOKEN: (if sibling-repos exist) PAT for cross-repo checkout
# =============================================================================

name: Soltein Validation

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main, master, develop, '17.0', '18.0', '19.0' ]
  # Post-merge full-scope run: Validation/Test/Badges below all switch to
  # 'full' scope on this trigger (see their own scope inputs) - this repo's
  # modules get exercised in full exactly once per merge instead of once per
  # PR push, and the coverage/lint badges get refreshed from an authoritative
  # whole-repo run instead of whatever subset the last PR's scope=changed
  # narrowed down to. No consumer beyond the badges today - purely
  # informational, doesn't gate anything (see the non-blocking notes below).
  push:
    branches: [ '{{ ODOO_VERSION }}' ]
  # Weekly badge updates
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 6 AM UTC
  workflow_dispatch:

concurrency:
  # push (post-merge full-scope run) groups by commit SHA, not ref - every
  # push to the same branch has a different SHA, so this group is always
  # unique and cancel-in-progress never actually cancels anything for push.
  # Deliberate: a post-merge full-scope run represents one specific merged
  # commit's own validation result and has standalone value (this is the
  # authoritative signal solt-suite's TestPostMerge/Badges depend on) - it
  # must not be thrown away just because another, unrelated merge lands a
  # minute later. On a repo with an actively-merging team, sharing ref-scoped
  # groups with pull_request meant every full-scope run raced the *next*
  # merge and usually lost, cancelled before ever completing (confirmed the
  # hard way: a 3+ hour solt-suite run was cancelled this way by an unrelated
  # merge). pull_request keeps its ref-scoped group unchanged - cancelling a
  # stale run in favor of a newer push to the SAME PR is exactly what you
  # want during iterative development.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # LINT - Code quality, branch naming, field attributes, docstrings
  # Runs on Pull Requests, and again full-scope on push to '{{ ODOO_VERSION }}' (post-merge)
  # ---------------------------------------------------------------------------
  Validation:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-validate.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      # 'full' on push (post-merge - lint the whole repo, not just one PR's
      # diff), 'changed' on pull_request (fast per-PR feedback). Validation is
      # cheap (seconds), so re-running it full-scope on every merge costs
      # nothing meaningful and is what keeps the Badges job below fed with
      # real solt-check/pylint/ruff numbers on push instead of stale ones.
      validation-scope: ${{ github.event_name == 'push' && 'full' || 'changed' }}
      # Blocking on pull_request (unchanged - this is the real per-PR gate), non-blocking on
      # push. 'full' scope on push checks every file in every module, not just one PR's diff -
      # a repo can easily carry pre-existing warnings across modules that pull_request's
      # scope=changed never touches. Left blocking there, the very first push-triggered run
      # would turn this branch's CI permanently red over pre-existing debt that PR never
      # introduced - contradicting this job's own "purely informational, doesn't gate anything"
      # design (see soltein-net/solt-llm#110's discussion, where this was first hit and fixed).
      # Badges still gets the real counts either way - GITHUB_OUTPUT is written by earlier
      # steps, before the (now-skipped-on-push) blocking gate would run.
      fail-on-warnings: ${{ github.event_name == 'pull_request' }}
      pylint-blocking: ${{ github.event_name == 'pull_request' }}
      ruff-blocking: false
      show-info: false

  # ---------------------------------------------------------------------------
  # TEST - Run Odoo module tests with coverage (pull_request only)
  # Note: Requires modules and sibling-repos to be auto-detected from manifests
  # If tests fail, this job fails and blocks the PR
  #
  # needs: Validation is deliberate: Validation is cheap (seconds) and already blocks merge
  # on its own, so a PR that fails Validation can never merge regardless of Test's
  # result. Running the far more expensive Test job (DB setup, sibling-repo
  # checkouts, coverage across every module) in parallel with a doomed Validation
  # run wastes CI minutes on every validation failure. Serializing costs green PRs
  # Validation's runtime (seconds) in added wall-clock latency, in exchange for
  # skipping all of Test's runtime (minutes) whenever Validation fails - a clear net
  # win given Validation failures are common during iterative development. If Validation
  # is skipped or fails, Test is automatically skipped too (default GitHub
  # Actions behavior for a job whose `needs` didn't succeed) - no separate
  # `if` needed here for that.
  #
  # This job is pull_request-only on purpose - see TestPostMerge below for why
  # push doesn't just reuse this one with a wider `if:`.
  # ---------------------------------------------------------------------------
  Test:
    needs: Validation
    if: github.event_name == 'pull_request'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
      # 'changed' - most PRs only touch a handful of this repo's modules -
      # see soltein-net/solt-pre-commit#36 for the narrowing/fallback/skip logic.
      scope: 'changed'
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # TEST (POST-MERGE) - Run Odoo module tests with coverage, full scope, on
  # push to '{{ ODOO_VERSION }}' only
  #
  # Deliberately its OWN job with no `needs: Validation` at all, rather than
  # widening Test's own `if:` to cover push too (e.g. `always() &&
  # (needs.Validation.result == 'success' || github.event_name == 'push')`) -
  # tried exactly that first and it does not work reliably: a job's `needs`
  # dependency on another job that itself calls a reusable workflow (`uses:`,
  # like Validation above) does not reliably expose that job's outcome to
  # `needs.<job>.result` / `success()` / `failure()` in a downstream job's own
  # `if:` - GitHub evaluates the *reusable workflow's internal jobs*, not the
  # calling job as one opaque unit, and that internal state can "leak" into
  # this job being skipped regardless of `always()` (see
  # https://github.com/orgs/community/discussions/189172 and
  # https://github.com/orgs/community/discussions/72708 for other reports of
  # the same class of bug). Confirmed the hard way: this repo's own push run
  # after the `always() && needs.Validation.result == 'success'` version
  # landed still showed Test's internal Detect/Coverage jobs as "skipped",
  # despite Validation only failing on real, pre-existing severity:error
  # issues that should have been irrelevant to the push-side override.
  #
  # The fix that's actually reliable: don't depend on Validation's outcome via
  # `needs` for the push case at all. This job has no `needs:` entry, so
  # nothing about Validation's internal job structure can propagate into its
  # own skip/run decision - only `github.event_name` does.
  # ---------------------------------------------------------------------------
  TestPostMerge:
    if: github.event_name == 'push'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-coverage.yml@{{ SOLT_VERSION }}
    with:
      modules: '{{ MODULES }}'
      sibling-repos: '{{ SIBLING_REPOS }}'
      odoo-version: '{{ ODOO_VERSION }}'
      python-version: '{{ PYTHON_VERSION }}'
      postgres-image: '{{ POSTGRES_IMAGE }}'
      # 'full' - one authoritative whole-repo run per merge instead of per
      # PR-push, feeding the coverage badge a real full-repo number instead of
      # whatever subset the last PR happened to touch.
      scope: 'full'
      # Splits this full-scope run's modules across N parallel shards (see
      # solt-coverage.yml's own `shards` input for the partitioning logic) -
      # '1' (no sharding) unless this repo's own setup-repo.py regenerate
      # call chose otherwise (see detect_current_shards() - regenerating
      # preserves whatever value is already here instead of silently
      # resetting it back to '1').
      shards: '{{ SHARDS }}'
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.SOLT_CROSS_REPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # BADGES - Report Validation and Test results to Gist badges
  # push only - these badges are keyed by branch (e.g. solt-suite-19.0-tests),
  # not by PR/branch-of-origin, so they're meant to answer "does 19.0 itself
  # currently pass" for anyone glancing at the README, not "did this one PR's
  # own diff pass". A developer's own PR/branch status is already fully
  # visible in the PR's own Checks list - it doesn't need a badge.
  #
  # Previously also ran on pull_request, on the theory that Validation runs
  # full-scope on push so the numbers would always be genuine there - true,
  # but Test still runs scope='changed' on a PR (only the modules that PR's
  # diff touched), and every open PR against the same base branch writes to
  # the exact same badge file. Whichever PR's own narrow, near-always-passing
  # result finished last silently overwrote the real branch state from the
  # last actual merge - confirmed live on soltein-net/solt-suite: the
  # post-merge run on 19.0 correctly found real failures and set the tests
  # badge to failing, then an unrelated PR's own passing (but irrelevant)
  # scope='changed' result clobbered it back to passing minutes later.
  #
  # Runs after Validation and TestPostMerge (whether they passed, failed, or
  # were skipped) - on push, Validation also runs full-scope, so
  # solt-check-errors/pylint-changed/ruff-changed below are always genuinely
  # computed this run, never a stale or default value. Test never runs on
  # push (see its own `if:`), so needs.Test.outputs.test-result is always
  # empty here and the `||` fallback to needs.TestPostMerge.outputs below
  # always wins - kept as `||` rather than switched to just
  # needs.TestPostMerge directly, so a future caller that reintroduces a
  # pull_request path here doesn't have to remember to change this too.
  # ---------------------------------------------------------------------------
  Badges:
    if: always() && github.event_name == 'push'
    needs: [ Validation, Test, TestPostMerge ]
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-check-badges.yml@{{ SOLT_VERSION }}
    with:
      odoo-version: '{{ ODOO_VERSION }}'
      solt-check-errors: ${{ needs.Validation.outputs.errors-count }}
      pylint-changed: ${{ needs.Validation.outputs.pylint-changed }}
      pylint-blocking: true
      ruff-changed: ${{ needs.Validation.outputs.ruff-changed }}
      ruff-blocking: false
      test-result: ${{ needs.Test.outputs.test-result || needs.TestPostMerge.outputs.test-result }}
      coverage-pct: ${{ needs.Test.outputs.coverage-pct || needs.TestPostMerge.outputs.coverage-pct }}
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

  # ---------------------------------------------------------------------------
  # WEEKLY DOCSTRING COVERAGE - Refresh docstring coverage badge on schedule
  # Runs independently on Mondays
  # ---------------------------------------------------------------------------
  Update-Docstrings-Badges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: soltein-net/solt-pre-commit/.github/workflows/solt-update-badges.yml@{{ SOLT_VERSION }}
    with:
      gist-id: ${{ vars.SOLTEIN_GIST_ID }}
      badge-filename-prefix: ${{ github.event.repository.name }}
      docstring-threshold: 80
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
