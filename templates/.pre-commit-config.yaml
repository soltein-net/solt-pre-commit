# =============================================================================
# PRE-COMMIT CONFIGURATION
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files
# Supports Odoo versions: 17.0, 18.0, 19.0
# =============================================================================

# Lets a plain `pre-commit install` (no --hook-type flag) install both the
# pre-commit AND pre-push git hooks in one shot - required for
# solt-test-changed-modules below to actually run on push.
default_install_hook_types: [ pre-commit, pre-push ]

repos:
  # ─────────────────────────────────────────────────────────────────────────
  # SOLT PRE-COMMIT HOOKS
  # No solt-check-branch here on purpose: branch-name enforcement for
  # standalone repos happens at PR level instead (.github/workflows/
  # solt-validate.yml, which auto-closes PRs with an invalid branch name),
  # not as a local commit-time gate. See templates/.pre-commit-config-local.yaml
  # for the monorepo-submodule variant, which keeps it locally too.
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/soltein-net/solt-pre-commit
    rev: v1.2.0
    hooks:
      - id: solt-check-odoo
        verbose: true
        # args: [--show-info] # Uncomment to see info-level issues
        # args: [--scope, full]  # Uncomment to validate entire repo
        # args: [--odoo-version, 18.0]  # Uncomment to force specific version
      - id: solt-check-requirements
        # args: [--fix]  # Uncomment to auto-regenerate instead of just checking
      - id: solt-test-changed-modules
        # Runs Odoo tests for modules changed vs. the base branch - only
        # when the current branch has an open PR (fails open otherwise).
        # Configure via .solt-hooks.yaml: test_odoo_bin, test_odoo_conf,
        # test_db_*, test_http_port/test_gevent_port, test_require_open_pr.

  # ─────────────────────────────────────────────────────────────────────────
  # PYTHON CODE QUALITY - Ruff (linter only, NO autofix, NO formatter)
  # Uses configuration from pyproject.toml
  # Note: Ruff is INFORMATIONAL - does not block commits/PRs
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [ --no-fix, --output-format=concise ]
        # Removed: --fix (no autofix)
        # Removed: ruff-format hook (no auto-formatting)

  # ─────────────────────────────────────────────────────────────────────────
  # ODOO-SPECIFIC LINTING (OCA) - BLOCKING with fail-on-warnings
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.0
    hooks:
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc

  # ─────────────────────────────────────────────────────────────────────────
  # GENERAL CODE QUALITY
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: end-of-file-fixer
        exclude: '\.(key|cer|pem|crt|der|p12|pfx)$'
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ --maxkb=500 ]
      - id: debug-statements

# =============================================================================
# CI CONFIGURATION
# =============================================================================
ci:
  autofix_prs: false  # Disabled - no auto-fixing
  autoupdate_schedule: weekly
