# =============================================================================
# SOLT PRE-COMMIT HOOKS - Default Configuration
# =============================================================================
# These are the system defaults. Users can override in their .solt-hooks.yaml
# Supports Odoo versions: 17.0, 18.0, 19.0
# =============================================================================

# =============================================================================
# ODOO VERSION
# =============================================================================
# Specify Odoo version or use 'auto' for automatic detection from manifest
# Options: auto, 17.0, 18.0, 19.0
odoo_version: auto

# Validation scope: 'changed' or 'full'
# - changed: Only validate files modified in PR/commit (recommended for legacy repos)
# - full: Validate entire repository
validation_scope: changed

# Base branch for detecting changed files (auto-detected if not set: tries the
# Odoo version embedded in the current branch name first, e.g. feature/17.0-x
# -> origin/17.0, then main/master/develop, then HEAD~1)
# base_branch: main

# Odoo test-run settings (solt-test-changed-modules / solt-test-module), used
# by the built-in runner - paths are relative to the git superproject working
# tree when this repo is a submodule (e.g. a solt-* addon repo checked out
# under a soltein-suite super-repo), otherwise this repo's own root.
# test_odoo_bin: odoo/odoo-bin
# test_odoo_conf: .devcontainer/dev_17/odoo.conf   # default: derived from odoo_version
# test_db_host: localhost      # default: $DB_HOST or localhost
# test_db_port: 5432           # default: $DB_PORT or 5432
# test_db_user: odoo           # default: $DB_USER or odoo
# test_db_password: odoo       # default: $DB_PASSWORD or odoo
# test_http_port: 18069        # dedicated port, distinct from an interactive dev server
# test_gevent_port: 18072

# Use a repo-provided script instead of the built-in runner, for a test setup
# unusual enough that the built-in runner's assumptions don't fit.
# test_harness_script: scripts/test-module.sh

# =============================================================================
# DISABLED CHECKS
# =============================================================================
disabled_checks: [ ]
  # - missing_readme
  # - po_requires_module

# =============================================================================
# SEVERITY LEVELS
# =============================================================================
# Levels: error, warning, info
#   - error:   Always blocks commit/PR
#   - warning: Blocks if in blocking_severities
#   - info:    Never blocks

severity:
  # Syntax errors
  xml_syntax_error: error
  csv_syntax_error: error
  python_syntax_error: error
  manifest_syntax_error: error
  po_syntax_error: error

  # Duplicates
  xml_duplicate_record_id: error
  csv_duplicate_record_id: error
  po_duplicate_message_definition: error
  xml_duplicate_fields: error

  # Odoo runtime warnings
  python_duplicate_field_label: error
  python_inconsistent_compute_sudo: error
  python_tracking_without_mail_thread: error
  python_selection_on_related: error
  xml_deprecated_active_id_usage: error
  xml_alert_missing_role: error

  # Dangerous patterns
  xml_create_user_wo_reset_password: warning
  xml_dangerous_filter_wo_user: warning
  xml_hardcoded_id: warning
  xml_duplicate_view_priority: warning

  # Deprecations
  xml_deprecated_tree_attribute: warning
  xml_deprecated_data_node: warning
  xml_deprecated_openerp_xml_node: warning
  xml_deprecated_t_raw: warning
  xml_deprecated_qweb_directive: warning

  # Code quality
  python_field_missing_string: warning
  python_field_missing_help: warning
  python_method_missing_docstring: warning
  python_docstring_too_short: info
  python_docstring_uninformative: info

  # PO quality
  po_requires_module: warning
  po_python_parse_printf: warning
  po_python_parse_format: warning

  # Other
  xml_redundant_module_name: info
  xml_not_valid_char_link: warning
  missing_readme: info

# =============================================================================
# BLOCKING SEVERITIES
# =============================================================================
blocking_severities:
  - error
  - warning

# =============================================================================
# SKIP LISTS
# =============================================================================
skip_string_fields:
  - active
  - name
  - sequence
  - company_id
  - currency_id
  - create_uid
  - create_date
  - write_uid
  - write_date
  - message_ids
  - message_follower_ids
  - activity_ids
  - display_name

skip_help_fields:
  - active
  - name
  - display_name
  - sequence
  - company_id
  - currency_id
  - create_uid
  - create_date
  - write_uid
  - write_date
  - message_ids
  - message_follower_ids
  - activity_ids
  - state

skip_docstring_methods: [ ]
  # - default_get
  # - create
  # - write
  # - unlink

min_docstring_length: 10

# =============================================================================
# PATH EXCLUSIONS
# =============================================================================
exclude_paths:
  - "**/migrations/**"
  - "**/tests/**"
  - "**/static/**"
  - "**/__pycache__/**"
  - "**/node_modules/**"

# =============================================================================
# BRANCH NAMING
# =============================================================================
branch_naming:
  strict: false
  ticket_prefixes:
    - SOLT
    - PROJ
  allowed_types:
    - feature
    - fix
    - hotfix
    - bugfix
    - release
    - refactor
    - docs
    - test
    - chore
    # Additional common types
    - imp
    - improvement
    - perf
    - style
    - ci
    - build
    - deps
    - config
    - security
    - ux
    - ui
    - infra
    - ops
    - revert
  protected_branches: [ ]
  protected_patterns: [ ]
