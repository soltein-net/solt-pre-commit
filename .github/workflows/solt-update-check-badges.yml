# =============================================================================
# SOLT PRE-COMMIT - Update Check Badges (Reusable)
# =============================================================================
# Writes the Solt-Check / Pylint-Odoo / Ruff / Tests / Coverage badges to the
# shared gist, from values other jobs already computed. Deliberately does NO
# checkout, no Python/Odoo setup - the whole point of splitting this out of
# solt-validate.yml/solt-coverage.yml is that "report a result as a badge" and
# "produce the result" are different jobs, so this one is as cheap as a job
# can be (just jq + gh api). Call it with `needs: [Lint, Test]` and
# `if: always()` so it runs whether the other jobs passed or failed.
#
# Docstring coverage is intentionally NOT here - that's solt-update-badges.yml,
# a separate, unrelated concern (a full-repo scan on its own weekly schedule,
# not a per-PR result).
# =============================================================================
name: Update Check Badges (Reusable)

on:
  workflow_call:
    inputs:
      odoo-version:
        required: true
        type: string
      gist-id:
        description: 'Gist ID for badge storage (default: Soltein central gist)'
        required: false
        type: string
        default: '147d543a086f6735d1ffa02172766e86'
      badge-filename-prefix:
        description: 'Prefix for badge filenames in gist (default: repository name)'
        required: false
        type: string
        default: ''
      solt-check-errors:
        description: 'Number of solt-check-odoo blocking errors'
        required: false
        type: string
        default: '0'
      pylint-changed:
        description: 'Number of Pylint-Odoo issues in changed files'
        required: false
        type: string
        default: '0'
      pylint-blocking:
        description: 'Whether Pylint-Odoo issues actually block this PR'
        required: false
        type: boolean
        default: false
      ruff-changed:
        description: 'Number of Ruff issues in changed files'
        required: false
        type: string
        default: '0'
      ruff-blocking:
        description: 'Whether Ruff issues actually block this PR'
        required: false
        type: boolean
        default: false
      test-result:
        description: |
          Test job result: "0" (pass), nonzero (fail), "skipped" (a test job
          existed but didn't run this time - e.g. TestPostMerge was gated off
          because Validation already failed - writes a distinct grey "not
          verified" badge rather than leaving the previous run's pass/fail
          color sitting there looking like a fresh result for a commit whose
          tests were never actually re-run). Omit entirely (empty) only when
          there is no test job configured for this repo at all.
        required: false
        type: string
        default: ''
      coverage-pct:
        description: 'Coverage percentage. Omit if there is no test job.'
        required: false
        type: string
        default: ''
      commit-timestamp:
        description: |
          The commit this run's results are for (github.event.head_commit.timestamp
          on a push), used to guard against a stale, out-of-order write. Push
          events don't cancel a prior push's own run (see solt-validate.yml's
          concurrency comment for why), so two runs for different commits can
          legitimately be in flight together, and the older one can finish
          *after* the newer one - without this, whichever run's Badges step
          happens to execute last wins the shared gist regardless of which
          commit is actually newer, silently regressing the badge back to a
          stale result. Omitted (empty, default): no ordering check, today's
          behavior - only worth passing from a push-triggered caller.
        required: false
        type: string
        default: ''
    secrets:
      GIST_SECRET:
        description: 'Token with write access to the badge gist. Optional - omit to skip this job entirely.'
        required: false

jobs:
  Badges:
    name: Update Check Badges
    runs-on: ubuntu-latest
    steps:
      - name: Update badges (Gist)
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GIST_SECRET not provided, skipping badge update"
            exit 0
          fi
          PREFIX="${{ inputs.badge-filename-prefix }}"
          if [ -z "$PREFIX" ]; then PREFIX="${{ github.event.repository.name }}"; fi
          VERSION="${{ inputs.odoo-version }}"
          META_FILE="${PREFIX}-${VERSION}-badge-meta.json"

          COMMIT_TS="${{ inputs.commit-timestamp }}"
          if [ -n "$COMMIT_TS" ]; then
            # ISO 8601 timestamps of the same fixed-width format sort
            # correctly as plain strings - no date parsing needed.
            EXISTING_TS=$(gh api "/gists/${{ inputs.gist-id }}" --jq ".files[\"$META_FILE\"].content // empty" 2>/dev/null | jq -r '.timestamp // empty' 2>/dev/null || echo "")
            if [ -n "$EXISTING_TS" ] && [[ "$EXISTING_TS" > "$COMMIT_TS" ]]; then
              echo "::notice::Skipping badge update - gist already reflects a newer commit ($EXISTING_TS is newer than this run's $COMMIT_TS)"
              exit 0
            fi
          fi

          badge_json() {
            local label="$1" count="$2" blocking="$3"
            local msg color plural=""
            if [ "$count" != "1" ]; then plural="s"; fi
            if [ "$count" -eq 0 ]; then msg="passing"; color="brightgreen";
            elif [ "$blocking" = "true" ]; then msg="${count} issue${plural}"; color="red";
            else msg="${count} issue${plural} (info)"; color="yellow"; fi
            jq -nc --arg l "$label" --arg m "$msg" --arg c "$color" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}'
          }

          FILES_JSON="{}"
          add_file() {
            FILES_JSON=$(echo "$FILES_JSON" | jq --arg f "$1" --arg c "$2" '. + {($f): {content: $c}}')
          }

          SOLT_CHECK_CONTENT=$(badge_json "solt-check (${VERSION})" "${{ inputs.solt-check-errors }}" "true")
          add_file "${PREFIX}-${VERSION}-solt-check.json" "$SOLT_CHECK_CONTENT"

          PYLINT_CONTENT=$(badge_json "pylint-odoo (${VERSION})" "${{ inputs.pylint-changed }}" "${{ inputs.pylint-blocking }}")
          add_file "${PREFIX}-${VERSION}-pylint.json" "$PYLINT_CONTENT"

          RUFF_CONTENT=$(badge_json "ruff (${VERSION})" "${{ inputs.ruff-changed }}" "${{ inputs.ruff-blocking }}")
          add_file "${PREFIX}-${VERSION}-ruff.json" "$RUFF_CONTENT"

          TEST_RESULT="${{ inputs.test-result }}"
          if [ "$TEST_RESULT" = "skipped" ]; then
            # A test job exists for this repo but didn't run this time (e.g.
            # gated off because Validation already failed) - grey "not
            # verified" beats silently leaving last run's green/red sitting
            # there looking like a fresh result for a commit that was never
            # actually tested.
            TEST_CONTENT=$(jq -nc --arg l "tests (${VERSION})" --arg m "not verified" --arg c "lightgrey" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}')
            add_file "${PREFIX}-${VERSION}-tests.json" "$TEST_CONTENT"
            COV_CONTENT=$(jq -nc --arg l "coverage (${VERSION})" --arg m "n/a" --arg c "lightgrey" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"python", logoColor:"white"}')
            add_file "${PREFIX}-${VERSION}-coverage.json" "$COV_CONTENT"
          elif [ -n "$TEST_RESULT" ]; then
            if [ "$TEST_RESULT" = "0" ]; then TEST_MSG="passing"; TEST_COLOR="brightgreen";
            else TEST_MSG="failing"; TEST_COLOR="red"; fi
            TEST_CONTENT=$(jq -nc --arg l "tests (${VERSION})" --arg m "$TEST_MSG" --arg c "$TEST_COLOR" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}')
            add_file "${PREFIX}-${VERSION}-tests.json" "$TEST_CONTENT"

            COV="${{ inputs.coverage-pct }}"
            if [ -n "$COV" ]; then
              if [ "$COV" -ge 80 ]; then COV_COLOR="brightgreen";
              elif [ "$COV" -ge 60 ]; then COV_COLOR="yellow";
              elif [ "$COV" -ge 40 ]; then COV_COLOR="orange";
              else COV_COLOR="red"; fi
              COV_CONTENT=$(jq -nc --arg l "coverage (${VERSION})" --arg m "${COV}%" --arg c "$COV_COLOR" \
                '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"python", logoColor:"white"}')
              add_file "${PREFIX}-${VERSION}-coverage.json" "$COV_CONTENT"
            else
              # Tests genuinely ran ($TEST_RESULT is 0/1, not skipped) but no
              # coverage percentage came back - e.g. the Test job crashed
              # before Combine ever saw a data file (confirmed live on
              # soltein-net/solt-themes: repo/requirements.txt was missing,
              # "Install Odoo + coverage" died before any shard could report
              # coverage). Leaving this file unwritten left the gist key
              # entirely absent - shields.io then renders a bright red
              # "resource not found" rather than a neutral "not measured",
              # which reads as far more alarming than a grey badge and never
              # self-corrects into a clean state once the underlying failure
              # stops happening (a `default: skipped`-shaped run overwrites
              # it fine; this had nothing to overwrite it with). Same grey
              # "n/a" the `skipped` branch above already uses.
              COV_CONTENT=$(jq -nc --arg l "coverage (${VERSION})" --arg m "n/a" --arg c "lightgrey" \
                '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"python", logoColor:"white"}')
              add_file "${PREFIX}-${VERSION}-coverage.json" "$COV_CONTENT"
            fi
          else
            # $TEST_RESULT itself came back completely empty - neither
            # "skipped" nor a real 0/1. Shouldn't normally happen (Combine
            # always writes one or the other), but if it ever does, this is
            # the same "never leave a gist key silently absent" principle as
            # both branches above, applied to both badges this time since
            # there's no result to report at all.
            TEST_CONTENT=$(jq -nc --arg l "tests (${VERSION})" --arg m "not verified" --arg c "lightgrey" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}')
            add_file "${PREFIX}-${VERSION}-tests.json" "$TEST_CONTENT"
            COV_CONTENT=$(jq -nc --arg l "coverage (${VERSION})" --arg m "n/a" --arg c "lightgrey" \
              '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"python", logoColor:"white"}')
            add_file "${PREFIX}-${VERSION}-coverage.json" "$COV_CONTENT"
          fi

          if [ -n "$COMMIT_TS" ]; then
            META_CONTENT=$(jq -nc --arg ts "$COMMIT_TS" --arg sha "${{ github.sha }}" '{timestamp:$ts, sha:$sha}')
            add_file "$META_FILE" "$META_CONTENT"
          fi

          jq -n --argjson files "$FILES_JSON" '{files: $files}' | \
          gh api --method PATCH "/gists/${{ inputs.gist-id }}" --input - \
            && echo "Updated badges for ${PREFIX} (${VERSION})" \
            || echo "::warning::Could not update check badges (non-fatal)"
