# =============================================================================
# SOLT PRE-COMMIT - Test + Coverage (Reusable)
# =============================================================================
# Runs a repo's own Odoo module tests with coverage, in that repo's own CI -
# proves "this module works against the dependency versions it declares",
# not "this module integrates with everything a client might combine it with"
# (that's the super-repo's job, testing whatever's actually pinned together).
#
# Odoo core (odoo/odoo) is checked out fresh each run since it's public. Any
# OTHER Odoo module dependency this repo's manifest declares (e.g. solt-crm
# depending on solt-base) has to be checked out as a sibling too, via
# `sibling-repos` - and if that sibling repo is private, checkout-token needs
# read access to it. actions/checkout can't loop over a dynamic list of repos,
# so siblings are cloned with plain `git clone` instead.
# =============================================================================
name: Coverage (test) - Reusable

on:
  workflow_call:
    inputs:
      sibling-repos:
        description: |
          Newline-separated additional module repos this depends on, each
          "owner/repo@ref:path" (e.g. "org/some-repo@17.0:some-repo").
          Leave empty if this repo's modules only depend on Odoo core.
        required: false
        type: string
        default: ''
      odoo-version:
        description: 'Odoo core branch to check out (also used as the badge version label)'
        required: false
        type: string
        default: '17.0'
      python-version:
        required: false
        type: string
        default: '3.11'
      postgres-image:
        description: |
          Postgres service image. Override when a module's manifest declares
          external_dependencies.postgresql needs (e.g. llm_pgvector needs the
          `vector` extension) - setup-repo.py sets this automatically from
          that declaration when it regenerates a caller's solt-validate.yml.
        required: false
        type: string
        default: 'postgres:15'
      scope:
        description: |
          'full' (default): test every Odoo module found in this repo (by `__manifest__.py`
          presence, minus `exclude_modules` in .solt-hooks.yaml), unconditionally - today's
          behavior, unchanged for any caller that doesn't set this.
          'changed': test only the detected modules that actually have a changed file in
          this PR's diff (reuses the same changed-file detection the local pre-push hook
          already uses for `test_scope: changed` in .solt-hooks.yaml - see
          checks_test_changed_modules.py). A diff can touch a module that's on
          `exclude_modules` - that's filtered out same as everywhere else, same as a diff
          that maps to no module at all: the Coverage job never runs at all (see the Detect
          job above it), reported as a pass with no coverage data, since no eligible
          module's behavior could possibly have changed. This is a job-level skip, not just
          a fast exit inside it - no Postgres service, no Odoo checkout/install pay their ~4
          minutes either, which is what actually mattered for a repo whose own tests, once
          running, take hours (see solt-suite's own 2h40m incident, entirely paid for a diff
          that turned out to touch zero modules).
          A repo with many modules in one addon repo (e.g. solt-llm's 24) should set this
          to 'changed' - most PRs there only ever touch 1-3 of them, and this job's own
          checkout/install overhead is fixed regardless of how many modules get tested, so
          the only thing 'changed' saves for a real, module-touching diff is the wasted
          minutes actually running every *other* module's full test suite.
        required: false
        type: string
        default: 'full'
      shards:
        description: |
          Number of parallel shards to split the detected module set across (default 1 -
          no sharding, today's behavior unchanged for any caller that doesn't set
          this). Each shard pays this job's own fixed checkout/install
          overhead independently (more total billed minutes), in exchange for
          wall-clock roughly divided by N (a 146-module, ~2.5h full-scope run
          split 8 ways is ~20 extra minutes of overhead for a ~20-minute wait
          instead of ~2.5 hours). Modules are distributed round-robin across
          shards (module i -> shard i % shards), not contiguous blocks - a
          contiguous split would put an entire large module family (e.g. a
          ~40-module l10n_*_edi family) in one or two shards, creating a
          straggler that dominates wall-clock regardless of shard count.
          Round-robin is a first approximation until real per-module timing
          (see odoo_test_runner's odoo.modules.loading:INFO telemetry) is
          available to rebalance by actual cost instead.
        required: false
        type: string
        default: '1'
      skip-if-errors:
        description: |
          A caller-supplied error count from its own cheap validation job
          (e.g. Validation's own errors-count output), passed through as
          plain data - never as a `needs.<job>.result`/success() check on a
          job that itself calls a reusable workflow, which is unreliable for
          exactly that shape (see solt-validate.yml's TestPostMerge comment
          for the confirmed incident). Empty or '0' runs Coverage normally
          (fail-open: an unreadable value must never silently skip a real
          test run, same philosophy as Detect's own should-skip default).
          Any other value skips the whole Coverage job outright - there is no
          point spending a multi-hour Odoo test run validating a commit
          already known to fail its own cheap lint/structure check.
        required: false
        type: string
        default: ''
      coverage-timeout-minutes:
        description: |
          Hard per-shard backstop against a genuine hang, not an SLA - real
          full-scope runs on a large, unsharded repo take 2.5-4h today (see
          `shards` above for cutting that down). 90 comfortably covers every
          current caller: solt-suite once sharded per that input's own
          numbers, and every other today's caller's much smaller module
          count regardless of sharding. A caller with a large module count
          that hasn't turned on sharding yet should raise this rather than
          hit false timeouts - lowering the ceiling to match reality belongs
          in `shards`, not here.
        required: false
        type: number
        default: 90
      checkout-ref:
        description: |
          Branch/tag/SHA to check out this repo (and re-check-out for
          Combine's coverage-path resolution) at, overriding the ambient
          github.ref this job would otherwise default to. Only needed by a
          caller triggered on a `schedule` event: github.ref for `schedule`
          is always the repo's *default* branch, regardless of which branch
          the cron is conceptually "for" - a caller whose default branch
          differs from the one it means to test (e.g. defaults to an older
          Odoo-version branch) would otherwise silently test the wrong one.
          Leave empty (default) for `push`/`pull_request` callers, where
          github.ref is already correct (the pushed branch, or the PR's own
          head) and overriding it would break PR testing (it must test the
          PR's own changes, not the base branch).
        required: false
        type: string
        default: ''
    secrets:
      CHECKOUT_TOKEN:
        description: 'Token with read access to sibling-repos. Only needed when sibling-repos is set.'
        required: false
    outputs:
      test-result:
        description: 'Test result: "0" (pass) or a nonzero exit code (fail)'
        value: ${{ jobs.Combine.outputs.test_result }}
      coverage-pct:
        description: 'Coverage percentage (integer, e.g. "40")'
        value: ${{ jobs.Combine.outputs.coverage_pct }}

env:
  SOLT_PRE_COMMIT_VERSION: v1.6.16

jobs:
  # ---------------------------------------------------------------------------
  # PLAN - computes the shard index list Coverage's matrix reads. Runs
  # regardless of Detect's own outcome (needs: [Detect] + if: always() -
  # Detect is a plain job, not one that itself calls a reusable workflow, so
  # this doesn't risk the .result/success() propagation bug documented
  # elsewhere in this repo) - a static `matrix: shard: [0, 1, ..., N-1]` can't
  # be written directly since `shards` is a runtime input, not a literal;
  # GitHub Actions matrices only accept a literal list or
  # `fromJSON(<a job output's actual JSON string>)`, so something has to
  # produce that JSON first.
  #
  # For scope='changed', `shards` (the caller's static, one-time-configured
  # value, meant for a full-scope run's own module count) is overridden by a
  # count derived from Detect's own matched-count: "a PR only ever narrows to
  # a handful of modules" doesn't hold for every PR (a broad/infrastructure
  # change can touch a third of the repo - confirmed live: a 50-module PR
  # ran unsharded for over an hour, roughly what an unsharded ~1/3-of-the-
  # repo run should cost). ~15 modules/shard, capped at 8 (the same ceiling
  # a full-scope run uses - a single PR needing more parallelism than the
  # whole repo's own scheduled run would is not worth planning for) keeps a
  # true "handful of modules" PR at 1 shard (no needless overhead) while
  # actually parallelizing the outlier ones.
  # ---------------------------------------------------------------------------
  Plan:
    name: Plan shard matrix
    needs: [ Detect ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      shard-list: ${{ steps.plan.outputs.shard-list }}
    steps:
      - name: Compute shard list
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          SCOPE: ${{ inputs.scope }}
          MATCHED_COUNT: ${{ needs.Detect.outputs.matched-count }}
        run: |
          python3 -c "
          import json, math, os

          scope = os.environ['SCOPE']
          shards = int(os.environ['SHARDS'])

          if scope == 'changed':
              matched_raw = os.environ.get('MATCHED_COUNT', '')
              if matched_raw.isdigit() and int(matched_raw) > 0:
                  shards = max(1, min(8, math.ceil(int(matched_raw) / 15)))

          shards = max(1, shards)
          print('shard-list=' + json.dumps(list(range(shards))))
          " >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # DETECT - scope='changed' only: is there anything at all worth spinning up
  # Coverage for? GitHub Actions provisions a job's `services:` containers (and
  # this job's own disk-space-free/checkout/Odoo-install steps run) before any
  # step gets a chance to decide there's nothing to test - the scope='changed'
  # skip inside "Run tests with coverage" below already avoids the expensive
  # *test run* for a diff with zero module-shaped changes, but every one of
  # those runs still paid ~4 minutes of Postgres-service-provisioning +
  # checkout + Odoo install first, just to reach that decision. This job makes
  # the same decision with none of that: a plain checkout and a `pip install`
  # of solt-pre-commit itself (no Odoo, no Postgres, no system build deps -
  # nothing this repo's manifests declare is needed to run the *detector*,
  # only to run the tests it might decide to skip). When it says skip, Coverage
  # below never starts at all - no service container, no disk-space cleanup,
  # no Odoo checkout, nothing.
  #
  # Only meaningful for scope='changed' - scope='full' (default) always tests
  # everything unconditionally, so there is nothing to detect; this job's own
  # `if:` skips it outright in that case, and Coverage's `if:` treats a skipped
  # Detect the same as "nothing to skip", i.e. proceeds exactly as before.
  # ---------------------------------------------------------------------------
  Detect:
    name: Detect whether there is anything to test
    if: inputs.scope == 'changed'
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.detect.outputs.should-skip }}
      # How many modules Coverage's own scope='changed' narrowing (the "Run
      # tests with coverage" step below) will actually end up testing -
      # Plan reads this to size the shard count for a PR whose diff is much
      # bigger than "a handful of modules" (see Plan's own comment for why
      # that assumption doesn't always hold). Duplicates that step's own
      # narrowing logic rather than sharing a script - same reasoning as the
      # "Same detection..." comment below already gives for should-skip.
      matched-count: ${{ steps.detect.outputs.matched-count }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install solt-pre-commit
        run: pip install "git+https://github.com/soltein-net/solt-pre-commit.git@${SOLT_PRE_COMMIT_VERSION}"

      - name: Detect changed modules
        id: detect
        run: |
          # Same detection as the "Run tests with coverage" step's own
          # scope='changed' branch below (SoltConfig.changed_detector - self-
          # heals a shallow clone by fetching the base ref if needed, reads
          # GITHUB_BASE_REF automatically in this context). Deliberately not
          # shared as a script file both jobs source - see that step's own
          # comment for why the `| tail -n 1` matters (debug noise on stdout).
          CHANGED_MODULES=$(cd repo && python3 -c "
          from pathlib import Path
          from solt_pre_commit.checks_odoo_module import _detect_modules_from_paths
          from solt_pre_commit.config_loader import SoltConfig

          config = SoltConfig('.solt-hooks.yaml')
          changed = config.changed_detector.get_changed_files()
          modules = _detect_modules_from_paths(sorted(changed))
          print(','.join(sorted({Path(m).name for m in modules})))
          " | tail -n 1)
          echo "Changed-module detection found: ${CHANGED_MODULES:-<none>}"

          # The eligible universe: every module this repo ships, minus
          # exclude_modules - live-scanned, not a generated/committed
          # snapshot (see the declared_modules issue this replaced). A
          # changed module can only fail to match this when it's on
          # exclude_modules - `_detect_modules_from_paths` above already
          # requires a manifest to currently exist, so a module deleted by
          # this same diff can never appear in CHANGED_MODULES in the first
          # place.
          ELIGIBLE=$(cd repo && python3 -c "
          from pathlib import Path
          from solt_pre_commit.config_loader import SoltConfig

          config = SoltConfig('.solt-hooks.yaml')
          excluded = set(config.exclude_modules)
          modules = sorted({p.parent.name for p in Path('.').rglob('__manifest__.py')} - excluded)
          print(','.join(modules))
          ")

          if [ -n "$CHANGED_MODULES" ]; then
            # Mirrors the "Run tests with coverage" step's own intersection
            # exactly, purely to size the shard count - the actual module
            # list used to run tests is still computed independently there.
            DECLARED=",$ELIGIBLE,"
            INTERSECT_COUNT=0
            IFS=',' read -ra CHANGED_ARR <<< "$CHANGED_MODULES"
            for m in "${CHANGED_ARR[@]}"; do
              case "$DECLARED" in
                *",$m,"*) INTERSECT_COUNT=$((INTERSECT_COUNT + 1)) ;;
              esac
            done
            if [ "$INTERSECT_COUNT" -gt 0 ]; then
              echo "should-skip=false" >> "$GITHUB_OUTPUT"
              echo "matched-count=$INTERSECT_COUNT" >> "$GITHUB_OUTPUT"
            else
              # Every changed module is on exclude_modules - nothing eligible
              # to test, same as an empty diff. No full-list fallback: unlike
              # the old committed-list version of this check, there's no
              # "forgotten regeneration" ambiguity left to hedge against.
              echo "should-skip=true" >> "$GITHUB_OUTPUT"
              echo "matched-count=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should-skip=true" >> "$GITHUB_OUTPUT"
            echo "matched-count=0" >> "$GITHUB_OUTPUT"
          fi

  Coverage:
    name: Run tests + coverage
    needs: [ Detect, Plan ]
    # always() is required here, not optional: a bare `if:` (without always(),
    # success(), failure(), or cancelled()) is implicitly ANDed with success()
    # by GitHub Actions, and a *skipped* needs job does not count as
    # "success" - so without always(), this job silently skipped on every
    # single `scope: 'full'` run (Detect's own `if: inputs.scope == 'changed'`
    # means it is *always* skipped for scope='full', by design), from the day
    # this Detect/Coverage split landed until this line was added. Found by
    # running solt-suite's real post-merge push (scope='full') end to end and
    # finding this job never even started, coverage_pct always empty.
    # inputs.skip-if-errors is plain data (a string the caller computed
    # itself), not a cross-job success()/.result check - see that input's own
    # description for why this specific comparison is safe where the
    # documented .result-based approach was not.
    if: |
      always() && (needs.Detect.result == 'skipped' || needs.Detect.outputs.should-skip != 'true') &&
      (inputs.skip-if-errors == '' || inputs.skip-if-errors == '0')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.Plan.outputs.shard-list) }}
    runs-on: ubuntu-latest
    # See coverage-timeout-minutes' own description above for why this is a
    # backstop against a genuine hang (e.g. a cancellation that somehow still
    # didn't reach the Odoo child - see odoo_test_runner.py's own SIGTERM
    # handling), not a number chosen to match today's expected runtime.
    timeout-minutes: ${{ inputs.coverage-timeout-minutes }}
    outputs:
      test_result: ${{ steps.test.outputs.result }}
      coverage_pct: ${{ steps.report.outputs.coverage_pct }}
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Free disk space
        run: |
          # This job's own footprint is already large before it does anything of
          # its own: Odoo core, up to 11 sibling-repo clones, and a heavy
          # requirements.txt (e.g. solt-llm's pulls in sentence-transformers,
          # crawlee's browser deps, llama_index) plus a Postgres+vector-extension
          # service image. GitHub-hosted ubuntu-24.04 runners ship with only
          # ~14GB free after their own preinstalled toolchains - most of which
          # (a full .NET SDK, Android SDK, GHC, a CodeQL bundle) no Odoo/Python
          # job here ever touches. A GitHub-side runner-image update can shrink
          # that baseline further with zero warning and no code change on our
          # side (see actions/runner-images#9329, #9344, #13189 for prior,
          # repeated instances of exactly this regression) - this job was
          # already close enough to the ceiling that one of those was enough to
          # tip a real PR into "No space left on device" mid-`pip install`,
          # with every actual test passing right up to that point.
          #
          # Removing this preinstalled bloat up front is the standard mitigation
          # for this failure class. It can't reclaim space the `postgres:`
          # service container's image already used - GitHub Actions provisions
          # service containers before any job step runs - but it frees real
          # room for everything this job's own steps do next: sibling-repo
          # checkouts and the heavy pip installs, which is where a repo like
          # solt-llm's actual pressure comes from.
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Checkout Odoo core (public)
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: ${{ inputs.odoo-version }}
          path: odoo
          fetch-depth: 1

      - name: Checkout sibling repos (declared module dependencies)
        if: inputs.sibling-repos != ''
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          if [ -z "$CHECKOUT_TOKEN" ]; then
            echo "::error::sibling-repos is set but no CHECKOUT_TOKEN secret was provided - cannot clone private dependency repos"
            exit 1
          fi
          # setup-repo.py generates this space-separated (multiple sibling
          # repos on one line), but this loop reads newline-separated - with
          # 2+ entries the whole value was read as a single "line", mangling
          # every repo_ref/path split into one wrong clone. Normalize either
          # separator to newline so both generator styles parse correctly.
          SIBLING_REPOS=$(printf '%s' "$SIBLING_REPOS" | tr -s ' ' '\n')
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            repo_ref="${line%%:*}"
            path="${line##*:}"
            repo="${repo_ref%%@*}"
            ref="${repo_ref##*@}"
            echo "Cloning $repo@$ref into $path"
            git clone --depth 1 --branch "$ref" "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${repo}.git" "$path"
          done <<< "$SIBLING_REPOS"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev postgresql-client \
            libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev \
            libssl-dev libffi-dev zlib1g-dev libjpeg-dev

      - name: Install Odoo + coverage
        env:
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          pip install --upgrade pip
          # A lockfile is a starting point, not a ceiling.
          #
          # odoo/requirements.txt is a reproducibility lockfile: it pins to what
          # Ubuntu Noble ships, as its own "(Noble)" comments say. Odoo's actual
          # dependency contract is setup.py, and there it declares cryptography,
          # pyOpenSSL and psutil with no bound at all. Passing the lockfile as
          # `-c` therefore asserted a compatibility requirement Odoo never made,
          # and any addon needing a newer floor of an exactly-pinned package
          # could not resolve at all - at any Python version, since the pin only
          # moves from 3.4.8 to 42.0.8 across the 3.12 boundary. That is what a
          # hand-maintained exclusion list was patching, one package at a time,
          # each entry costing a release of this repo.
          #
          # So: seed from the lockfile, which is worth keeping - those versions
          # are known good and their C extensions are known to build on the
          # runner. Then let the repo upgrade what it explicitly pins. An
          # explicit pin is a decision; the drift worth guarding against is the
          # unpinned dependency that creeps upward, and that one still lands on
          # Odoo's tested version because nothing asks it to move.
          pip install -r odoo/requirements.txt
          # Guarded like the sibling-repos loop below: a repo with no Python
          # deps beyond Odoo itself (e.g. a themes-only repo) legitimately
          # has no requirements.txt at all. Unconditionally installing it
          # failed the whole step under `bash -e`, which meant `pip install
          # coverage` further down never ran either - "coverage: command not
          # found" in every later step, from a repo that was never wrong to
          # not ship a requirements.txt (hit in soltein-net/solt-themes).
          if [ -f repo/requirements.txt ]; then
            pip install -r repo/requirements.txt
          fi
          if [ -n "$SIBLING_REPOS" ]; then
            # See the "Checkout sibling repos" step - same space-vs-newline
            # normalization, needed here too since this is a separate step
            # re-reading the same raw input.
            SIBLING_REPOS=$(printf '%s' "$SIBLING_REPOS" | tr -s ' ' '\n')
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              path="${line##*:}"
              if [ -f "$path/requirements.txt" ]; then
                echo "Installing sibling dependencies: $path/requirements.txt"
                pip install -r "$path/requirements.txt"
              fi
            done <<< "$SIBLING_REPOS"
          fi
          pip install coverage
          # Not on PyPI - installed straight from the tagged commit instead.
          # A composite action referenced by relative path was tried here to
          # share this literal with solt-validate.yml/solt-update-badges.yml,
          # but shipped broken in v1.3.1 - a reusable workflow's job doesn't
          # have its own defining repo checked out by default, so the
          # relative path can't resolve. Back to a plain per-file env var
          # (env.SOLT_PRE_COMMIT_VERSION below) - bump it here, and in the
          # identical block in the other two files, on every release.
          pip install "git+https://github.com/soltein-net/solt-pre-commit.git@${SOLT_PRE_COMMIT_VERSION}"

          # The guard, and it replaces the constraint rather than joining it.
          # Not "did any version change against a list somebody maintains", but
          # "is the installed set coherent" - which is what actually breaks, and
          # is the one question the packages themselves can answer. pyOpenSSL
          # declaring `cryptography<47,>=46.0.0` is how the pair that motivated
          # all of this gets caught, with nobody writing it down anywhere.
          #
          # Last, so it sees everything: the repo, every sibling, and coverage.
          #
          # It only sees *declared* incompatibilities, and Odoo is checked out
          # rather than installed as a distribution, so its own needs are not in
          # metadata for pip to read. That half is covered by the step that runs
          # the tests, which starts Odoo with the modules loaded - the same
          # backstop the constraint relied on, since it could not police a
          # package Odoo does not pin either.
          pip check

      - name: Build addons-path
        id: addons_path
        env:
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          PATH_LIST="$GITHUB_WORKSPACE/odoo/odoo/addons,$GITHUB_WORKSPACE/odoo/addons,$GITHUB_WORKSPACE/repo"
          if [ -n "$SIBLING_REPOS" ]; then
            # See the "Checkout sibling repos" step - same normalization.
            SIBLING_REPOS=$(printf '%s' "$SIBLING_REPOS" | tr -s ' ' '\n')
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              path="${line##*:}"
              PATH_LIST="$PATH_LIST,$GITHUB_WORKSPACE/$path"
            done <<< "$SIBLING_REPOS"
          fi
          echo "value=$PATH_LIST" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        id: test
        env:
          ADDONS_PATH: ${{ steps.addons_path.outputs.value }}
          SOLT_ODOO_VERSION: ${{ inputs.odoo-version }}
          SCOPE: ${{ inputs.scope }}
          SHARDS: ${{ inputs.shards }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          # solt-test-module (odoo_test_runner.py) requires a conf file to
          # exist at .devcontainer/dev_<major>/odoo.conf before it will run
          # anything - its content barely matters here since every real
          # setting (db host/port/user/password, ports, addons-path) is
          # still supplied via env vars/CLI flags, same as before this
          # migration. SOLT_ODOO_VERSION makes the derived <major> match
          # inputs.odoo-version deterministically instead of relying on
          # manifest auto-detection, which could disagree with it.
          #
          # --config repo/.solt-hooks.yaml: without this, SoltConfig() searches
          # for .solt-hooks.yaml starting at $GITHUB_WORKSPACE (this step's cwd)
          # walking UP - it never looks inside repo/, so the checked-out repo's
          # own .solt-hooks.yaml (test_server_wide_modules and friends) was
          # silently never read here. Safe to pass even when the file doesn't
          # exist - SoltConfig falls back to defaults.
          MAJOR="${SOLT_ODOO_VERSION%%.*}"
          mkdir -p ".devcontainer/dev_${MAJOR}"
          echo "[options]" > ".devcontainer/dev_${MAJOR}/odoo.conf"

          # The eligible universe: every module this repo ships (by
          # `__manifest__.py` presence), minus exclude_modules in
          # .solt-hooks.yaml - live-scanned every run instead of trusting a
          # generated/committed `modules:` snapshot (see the declared_modules
          # issue this replaced - a module added without re-running a
          # regeneration script used to be silently never tested).
          MODULES_CSV=$(cd repo && python3 -c "
          from pathlib import Path
          from solt_pre_commit.config_loader import SoltConfig

          config = SoltConfig('.solt-hooks.yaml')
          excluded = set(config.exclude_modules)
          modules = sorted({p.parent.name for p in Path('.').rglob('__manifest__.py')} - excluded)
          print(','.join(modules))
          ")

          # scope: 'changed' - narrow MODULES_CSV to only the eligible modules that
          # actually have a changed file in this PR's diff. Reuses the exact same
          # changed-file detection the local pre-push hook already uses for
          # test_scope: changed (SoltConfig.changed_detector - self-heals a shallow
          # clone by fetching the base ref if it's not already available locally, and
          # reads GITHUB_BASE_REF automatically in this context - no extra checkout
          # config needed here).
          if [ "$SCOPE" = "changed" ]; then
            # | tail -n 1: ChangedFilesDetector._log() prints "[ChangedFilesDetector] ..."
            # debug lines to stdout unconditionally whenever it detects a CI context (not
            # gated behind SOLT_DEBUG there) - without this, $(...) below captures that
            # noise ahead of the actual CSV line, CHANGED_MODULES ends up holding debug
            # text instead of module names, and every scope=changed run on a real PR
            # silently falls through to "nothing eligible matched" regardless of what
            # actually changed. The real result print(...) is always the last line
            # printed, so tail -n 1 reliably isolates it from the debug noise above it.
            CHANGED_MODULES=$(cd repo && python3 -c "
          from pathlib import Path
          from solt_pre_commit.checks_odoo_module import _detect_modules_from_paths
          from solt_pre_commit.config_loader import SoltConfig

          config = SoltConfig('.solt-hooks.yaml')
          changed = config.changed_detector.get_changed_files()
          modules = _detect_modules_from_paths(sorted(changed))
          print(','.join(sorted({Path(m).name for m in modules})))
          " | tail -n 1)
            echo "Changed-module detection found: ${CHANGED_MODULES:-<none>}"
            if [ -n "$CHANGED_MODULES" ]; then
              DECLARED=",$MODULES_CSV,"
              INTERSECT=""
              IFS=',' read -ra CHANGED_ARR <<< "$CHANGED_MODULES"
              for m in "${CHANGED_ARR[@]}"; do
                case "$DECLARED" in
                  *",$m,"*) INTERSECT="${INTERSECT}${m}," ;;
                esac
              done
              INTERSECT="${INTERSECT%,}"
              if [ -n "$INTERSECT" ]; then
                echo "scope=changed: testing $INTERSECT (eligible: $MODULES_CSV)"
                MODULES_CSV="$INTERSECT"
              else
                # Every changed module is on exclude_modules - `_detect_modules_from_paths`
                # above already requires a manifest to currently exist, so a module deleted
                # by this same diff can never reach CHANGED_MODULES in the first place. No
                # full-list fallback: there's no "forgotten regeneration" ambiguity left to
                # hedge against, so this is treated exactly like "nothing changed" below.
                echo "scope=changed: every changed module is excluded - nothing to test, skipping"
                echo "modules-tested=" >> "$GITHUB_OUTPUT"
                echo "result=0" >> "$GITHUB_OUTPUT"
                echo "skipped=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              # The diff touched zero Odoo-module-shaped paths at all - CI config,
              # docs, non-addon scripts. No module's behavior could possibly have
              # changed, so testing the full eligible list provides zero additional
              # signal about *this* diff - it is pure cost for a fixed answer. Skip
              # outright rather than pay the full-scope run for nothing: this is
              # what turned a 146-module Odoo repo's docs-only PR into a 2h40m
              # run for a config change that touched no module at all.
              echo "scope=changed: no changed modules detected - nothing to test, skipping"
              echo "modules-tested=" >> "$GITHUB_OUTPUT"
              echo "result=0" >> "$GITHUB_OUTPUT"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # shards > 1: further narrow MODULES_CSV to just this matrix leg's
          # share, round-robin (module i -> shard i % SHARDS) - see the
          # `shards` input's own description for why round-robin over
          # contiguous blocks. A no-op when SHARDS=1 (every module's index
          # modulo 1 is 0, so shard 0 keeps everything) - the common,
          # unsharded case is exactly today's behavior, just routed through
          # the same code path instead of a separate one.
          if [ "$SHARDS" -gt 1 ]; then
            MODULES_CSV=$(python3 -c "
          import os
          modules = '$MODULES_CSV'.split(',')
          shard, shards = int(os.environ['SHARD_INDEX']), int(os.environ['SHARDS'])
          print(','.join(m for i, m in enumerate(modules) if i % shards == shard))
          ")
            echo "Shard $SHARD_INDEX/$SHARDS: testing $MODULES_CSV"
          fi

          # DB_HOST/DB_PORT/DB_USER/DB_PASSWORD are not set here - SoltConfig's
          # own defaults (localhost/5432/odoo/odoo) already match the postgres
          # service above exactly. Scratch-DB create/drop is now handled
          # internally by solt-test-module, not this workflow.
          #
          # modules-tested carries this step's *final* MODULES_CSV (narrowed by
          # scope=changed, or the untouched full list otherwise) to the Coverage
          # report step below via GITHUB_OUTPUT - shell variables don't survive
          # between steps. Without this, that step falls back to re-deriving the
          # full eligible list (live manifest scan minus exclude_modules) and its
          # --include pattern would span every eligible module regardless of
          # scope, so a scope=changed run's coverage% would count the untested
          # modules' entirely-untraced source as 0% covered and tank the number
          # for modules that were actually well covered. Written before
          # solt-test-module runs, so it's captured even if the step then fails.
          echo "modules-tested=$MODULES_CSV" >> "$GITHUB_OUTPUT"

          # Also written as plain files, not just GITHUB_OUTPUT: this step's
          # own `steps.test.outputs.*` only feeds THIS matrix leg's own,
          # single-leg Coverage report step below - a matrix job's outputs at
          # the *job* level are last-leg-wins (see this repo's own README on
          # solt-pre-commit's per-Python-version test badges for the same
          # caveat), not reliable for the Combine job below to read every
          # shard's result from. Uploaded as part of this shard's artifact
          # instead, one file per shard, so Combine can read all of them.
          mkdir -p shard-output
          echo -n "$MODULES_CSV" > shard-output/modules-tested.txt

          # COVERAGE_FILE: each shard writes its own, uniquely-named data
          # file - shards run on separate runners, so there's no actual
          # collision risk within one run, but an explicit, predictable name
          # is what Combine downloads and passes to `coverage combine`
          # afterwards, rather than relying on `coverage combine`'s own
          # directory-scanning heuristics (which look for a specific
          # parallel-mode suffix pattern that a plain default `.coverage`
          # file downloaded into a shard-named subdirectory may not match).
          export COVERAGE_FILE="$PWD/shard-output/.coverage.shard${SHARD_INDEX}"
          set +e
          solt-test-module "$MODULES_CSV" --addons-path "$ADDONS_PATH" --config repo/.solt-hooks.yaml 2>&1 | tee test_output.txt
          RESULT=${PIPESTATUS[0]}
          set -e
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo -n "$RESULT" > shard-output/result.txt
          exit "$RESULT"

      - name: Summarize test failures
        # Odoo's own raw test log is unittest-shaped noise: per-module
        # "Loading module X (n/N)" INFO lines (re-enabled above for
        # per-module timing) interleaved with hundreds/thousands of query
        # counts, and only ONE aggregate "N failed, M error(s) of K tests"
        # line - a developer chasing a CI failure has no way to see *which*
        # tests actually failed without scrolling/grepping the entire raw
        # Action log (confirmed complaint: developers reported this as
        # genuinely hard to read).
        #
        # Odoo's test runner logs each individual failure as its own
        # ERROR-level record - `FAIL: <TestClass>.<method>` or `ERROR:
        # setUpClass (<module.TestClass>)` - immediately followed by a plain
        # Python traceback. Extracts those into a short, pytest-style
        # summary (one line per failing test plus its final exception
        # message) with the full traceback collapsed underneath, written
        # into this job's own Step Summary - shown right on the run/PR
        # Checks tab, no need to open the raw log for the common case. Also
        # files each as a `::error::` annotation, which surfaces the same
        # short message at the top of the Checks UI. Both are GitHub
        # Actions' own standard, built-in mechanisms for this - reused here
        # rather than inventing a bespoke report format, matching the
        # `::warning::` already used by the Coverage report step below for
        # the same reason.
        #
        # A failure that happened before any test ran at all (e.g. a module
        # failed to install) has no matching FAIL/ERROR record - the
        # fallback branch below says so plainly rather than producing an
        # empty, misleadingly-reassuring summary.
        if: always() && steps.test.outputs.skipped != 'true'
        env:
          RESULT: ${{ steps.test.outputs.result }}
          MODULES_TESTED: ${{ steps.test.outputs.modules-tested }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          result = os.environ.get("RESULT", "")
          modules = os.environ.get("MODULES_TESTED") or "?"

          if result == "0" or not os.path.exists("test_output.txt"):
              raise SystemExit(0)

          with open("test_output.txt", errors="replace") as f:
              lines = f.readlines()

          # Marks the start of the *next* log record, however it's leveled -
          # used only to know where the current failure's traceback block
          # ends, not to identify failures itself.
          RECORD_START = re.compile(r"^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ \d+ (ERROR|WARNING|INFO) ")
          FAILURE = re.compile(
              r"^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ \d+ ERROR \S+ \S+: (FAIL|ERROR): (.+?)\s*$"
          )
          SUMMARY_LINE = re.compile(r"(\d+ failed, \d+ error\(s\) of \d+ tests.*)$")

          failures = []
          overall_summary = None
          i = 0
          while i < len(lines):
              m = FAILURE.match(lines[i])
              if m:
                  kind, test_id = m.group(1), m.group(2)
                  block = []
                  j = i + 1
                  while j < len(lines) and not RECORD_START.match(lines[j]):
                      block.append(lines[j].rstrip("\n"))
                      j += 1
                  detail = next((l for l in reversed(block) if l.strip()), "").strip()
                  failures.append((kind, test_id, detail, "\n".join(block).strip()))
                  i = j
                  continue
              sm = SUMMARY_LINE.search(lines[i])
              if sm:
                  overall_summary = sm.group(1)
              i += 1

          out = [f"## ❌ Failed tests ({modules})\n"]
          if overall_summary:
              out.append(f"{overall_summary}\n")

          if not failures:
              out.append(
                  f"Test run exited with code {result}, but no per-test FAIL/ERROR records "
                  "were found in the log - this usually means something broke before any "
                  "test ran (e.g. a module failed to install). See the full job log above.\n"
              )
          else:
              for kind, test_id, detail, _ in failures:
                  out.append(f"- **{kind}** `{test_id}` — {detail or '(see full output below)'}")
              out.append("")
              for kind, test_id, _, block in failures:
                  out.append(f"<details><summary><code>{kind}</code> {test_id}</summary>\n")
                  out.append("```")
                  out.append(block or "(no output captured)")
                  out.append("```")
                  out.append("</details>\n")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("\n".join(out) + "\n")

          # GitHub itself only renders the first 10 annotations per step -
          # capped to match, a run with more than that has bigger problems
          # than a long annotation list.
          for kind, test_id, detail, _ in failures[:10]:
              msg = f"{test_id}: {detail}" if detail else test_id
              msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", " ")
              print(f"::error::{msg}")
          PYEOF

      - name: Coverage report
        id: report
        if: always()
        env:
          MODULES_TESTED: ${{ steps.test.outputs.modules-tested }}
          SKIPPED: ${{ steps.test.outputs.skipped }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          # This shard's own data file, same COVERAGE_FILE the "Run tests"
          # step wrote to - env vars set with `export` there don't survive
          # into this separate step's own shell, so it has to be repeated
          # here. This step's own report is this *shard's* subset only,
          # informational (visible per-shard in the run's summary/artifacts) -
          # the authoritative, whole-repo-or-whole-scope number comes from the
          # Combine job below, which downloads every shard's data file and
          # runs `coverage combine` across all of them.
          export COVERAGE_FILE="$PWD/shard-output/.coverage.shard${SHARD_INDEX}"

          # scope=changed found nothing to test at all (see the "Run tests" step) -
          # nothing ran, so there is no trace data to report. Reporting one anyway
          # would compute 0% against every declared module (none of them loaded),
          # which is not "this diff dropped coverage" - it is "coverage wasn't
          # measured this run" - and could otherwise trip the org's
          # max_coverage_drop ruleset rule for a PR that never touched a module.
          if [ "$SKIPPED" = "true" ]; then
            echo "Nothing was tested this run (scope=changed found no module-shaped changes) - skipping the coverage report."
            echo "coverage_pct=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Report coverage over exactly the modules the previous step actually
          # tested (steps.test's modules-tested output - already normalized,
          # already narrowed if scope=changed applied), not the full eligible
          # list - otherwise --include below would span every eligible module,
          # and modules that were never even loaded this run (0 trace data, all
          # statements "missing") would drag percent_covered down for modules
          # that were genuinely well covered. Falls back to re-deriving the full
          # eligible list (same live manifest scan the Run tests step uses) only
          # if modules-tested is unset - e.g. the Run tests step failed before
          # reaching that computation - matching this step's own if: always()
          # intent of still reporting something useful.
          if [ -n "$MODULES_TESTED" ]; then
            MODULES_CSV="$MODULES_TESTED"
          else
            MODULES_CSV=$(cd repo && python3 -c "
          from pathlib import Path
          from solt_pre_commit.config_loader import SoltConfig

          config = SoltConfig('.solt-hooks.yaml')
          excluded = set(config.exclude_modules)
          modules = sorted({p.parent.name for p in Path('.').rglob('__manifest__.py')} - excluded)
          print(','.join(modules))
          ")
          fi
          IFS=',' read -ra MODULE_ARR <<< "$MODULES_CSV"
          INCLUDE=""
          for m in "${MODULE_ARR[@]}"; do INCLUDE="${INCLUDE}*/${m}/*,"; done
          INCLUDE="${INCLUDE%,}"

          # `coverage report`/`html`/`json` each raise CoverageException("No
          # data to report.") and exit 1 when nothing in $INCLUDE was actually
          # exercised - e.g. a module with zero test cases (solt-test-module
          # still runs and legitimately reports "0 failed, 0 error(s) of 0
          # tests"), or a declared module name that never got loaded. That's a
          # real, non-error outcome distinct from the $SKIPPED case above
          # (solt-test-module did run here) - under `set -e` it was instead
          # aborting this step outright, which is why coverage.json below
          # never got a chance to report itself as unknown the way it's meant
          # to. `|| true` on each, same graceful-degradation treatment the
          # Combine job's own equivalent step already gives these three calls
          # via subprocess(..., check=False).
          coverage report --include="$INCLUDE" | tee coverage_report.txt || true
          {
            echo "## Coverage Report ($MODULES_CSV)"
            echo ""
            echo '```'
            cat coverage_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          coverage html --include="$INCLUDE" -d htmlcov || true
          coverage json --include="$INCLUDE" -o coverage.json || true

          if [ -s coverage.json ] && COV=$(python3 -c "import json,sys; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered']))" 2>/tmp/coverage_parse_err); then
            echo "coverage_pct=$COV" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not parse coverage.json ($(cat /tmp/coverage_parse_err 2>/dev/null)) - reporting coverage as unknown, not 0%"
            echo "coverage_pct=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Shard-suffixed - with shards > 1, every matrix leg would otherwise
          # try to upload an artifact with the exact same name
          # (coverage-html-<run_id>), which actions/upload-artifact@v4
          # rejects as a duplicate (unlike v3, it does not silently merge or
          # overwrite). A no-op naming-wise when shards=1 (one leg, one name,
          # same as before).
          name: coverage-html-${{ github.run_id }}-shard${{ matrix.shard }}
          path: htmlcov/
          retention-days: 30

      - name: Upload shard data for Combine
        # Not gated on always() the same way as the HTML upload above:
        # nothing to upload at all when this shard's "Run tests" step exited
        # early via the scope=changed/no-changes safety net (see that step's
        # own comment) - shard-output/ is never created in that case. Combine
        # already treats "no shard artifacts at all" as its own skip case,
        # matching this job's own if: always() && (...) skip semantics one
        # level up.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-data-${{ matrix.shard }}
          path: shard-output/
          # actions/upload-artifact@v4 drops dotfiles by default (its glob
          # doesn't match hidden files unless told to) - the whole point of
          # this artifact is .coverage.shard${SHARD_INDEX}, so without this
          # the upload silently succeeds with everything *except* the one
          # file Combine actually needs. Confirmed live on
          # soltein-net/solt-suite#667: this shard's own Coverage report
          # step read the file fine and printed a real percentage, but the
          # uploaded artifact only had modules-tested.txt and result.txt -
          # Combine then found no `.coverage.*` files at all and fell back
          # to reporting coverage as unknown, which the org's CI Gate
          # ruleset's code_coverage rule can't resolve against its
          # minimum_coverage/max_coverage_drop thresholds, leaving the PR
          # blocked indefinitely with no failing check pointing at why.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------------------
  # COMBINE - merges every shard's coverage data + pass/fail into the one
  # test-result/coverage-pct this reusable workflow actually promises callers
  # (see on.workflow_call.outputs at the top). Always its own job, even when
  # shards=1 (one shard, one artifact) - keeps a single code path instead of
  # "sharded" and "unsharded" behaving differently, and Coverage's own
  # per-matrix-leg `outputs:` are last-leg-wins across a real matrix (multiple
  # legs setting the same job-level output name is not reliable - GitHub
  # Actions keeps whichever leg happens to finish last), so something has to
  # read every shard's own result from a side channel (the uploaded
  # artifacts) regardless of shard count.
  #
  # needs: [ Detect, Coverage ] + if: always() is deliberate, same reasoning
  # as Coverage's own if: above it: Coverage can legitimately be skipped
  # entirely (Detect said should-skip=true), and a bare `if:` here would
  # silently skip this job too the same way Coverage itself did before that
  # bug was found and fixed - always() is not optional on any job whose
  # `needs` can be skipped, not just failed.
  # ---------------------------------------------------------------------------
  Combine:
    name: Combine shard results
    needs: [ Detect, Coverage ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.combine.outputs.test_result }}
      coverage_pct: ${{ steps.combine.outputs.coverage_pct }}
    steps:
      - name: Download every shard's data
        # continue-on-error, not gating this job on the download succeeding:
        # a pattern matching zero artifacts (Coverage was entirely skipped,
        # or every shard's own "nothing to test" safety net fired) is a real,
        # valid outcome here, not a failure - the combine step below checks
        # for "no shard directories found" itself and reports the same
        # skipped/unknown result Coverage's own report step would have.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-data-*
          path: shard-artifacts
          merge-multiple: false

      - name: Checkout this repo
        # coverage.py's data files record absolute source paths from the
        # shard runners (e.g. .../solt-suite/repo/solt_base/__init__.py) -
        # `coverage report`/`html`/`json` below need those files actually
        # present at that same path to resolve statement counts, or every
        # module fails with "No source for code" and the JSON report never
        # gets written at all - same end symptom as no data files at all:
        # coverage reported as unknown, just one step later. Same `path:
        # repo` the shard job itself uses, so the recorded paths resolve
        # identically here.
        #
        # Unconditional, same as the job itself (if: always() above) - a
        # checkout on a run with no shard data to combine is a few wasted
        # seconds, not worth a second signal to keep in sync with the
        # combine step's own "nothing to combine" check below.
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Checkout sibling repos (declared module dependencies)
        # Same reasoning as "Checkout this repo" above - a module measured
        # by this run could live in a sibling repo, not just this one.
        if: inputs.sibling-repos != ''
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          if [ -z "$CHECKOUT_TOKEN" ]; then
            echo "::error::sibling-repos is set but no CHECKOUT_TOKEN secret was provided - cannot clone private dependency repos"
            exit 1
          fi
          SIBLING_REPOS=$(printf '%s' "$SIBLING_REPOS" | tr -s ' ' '\n')
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            repo_ref="${line%%:*}"
            path="${line##*:}"
            repo="${repo_ref%%@*}"
            ref="${repo_ref##*@}"
            echo "Cloning $repo@$ref into $path"
            git clone --depth 1 --branch "$ref" "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${repo}.git" "$path"
          done <<< "$SIBLING_REPOS"

      - name: Setup Python
        # Still no cache: 'pip' - this job's own dependency is just
        # `pip install coverage` below, a single package with no
        # requirements.txt/pyproject.toml of its own to key a cache off of.
        # The checkout above exists to give coverage.py source files to
        # resolve, not to change what this step installs.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install coverage
        run: pip install coverage

      - name: Combine shard data and report
        id: combine
        env:
          SKIP_IF_ERRORS: ${{ inputs.skip-if-errors }}
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import subprocess
          import sys

          def write_output(**kwargs):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for key, value in kwargs.items():
                      f.write(f"{key}={value}\n")

          shard_dirs = sorted(d for d in glob.glob("shard-artifacts/*/") if os.path.isdir(d))
          if not shard_dirs:
              skip_if_errors = os.environ.get("SKIP_IF_ERRORS", "")
              if skip_if_errors and skip_if_errors != "0":
                  # Distinct from the branch below: here, Coverage never even
                  # attempted a run - it was gated off because validation
                  # already reported real errors. "0/pass" would be actively
                  # wrong (the false-confidence scenario this whole gate
                  # exists to avoid), so this gets its own sentinel the
                  # caller's badge-writer renders as a neutral "not verified",
                  # never as a fabricated pass.
                  print(f"No shard data - Coverage was gated off (validation reported {skip_if_errors} error(s)). "
                        "Tests were never run for this commit.")
                  write_output(test_result="skipped", coverage_pct="")
              else:
                  print("No shard data found (every shard found nothing to test, scope=changed with no "
                        "matching module) - nothing to combine, reporting a pass with no coverage data.")
                  write_output(test_result="0", coverage_pct="")
              sys.exit(0)

          modules = set()
          overall_result = 0
          data_files = []
          for shard_dir in shard_dirs:
              modules_tested_path = os.path.join(shard_dir, "modules-tested.txt")
              result_path = os.path.join(shard_dir, "result.txt")
              if os.path.exists(modules_tested_path):
                  with open(modules_tested_path) as f:
                      modules.update(m for m in f.read().split(",") if m)
              if os.path.exists(result_path):
                  with open(result_path) as f:
                      if f.read().strip() != "0":
                          overall_result = 1
              # Explicit glob, not a bare directory arg to `coverage combine` -
              # coverage.py's own directory-scanning combine logic looks for a
              # specific parallel-mode suffix pattern; being explicit about
              # which files these are removes any doubt it will find them.
              data_files.extend(glob.glob(os.path.join(shard_dir, ".coverage.*")))

          print(f"{len(shard_dirs)} shard(s), modules tested: {','.join(sorted(modules)) or '<none>'}")
          print(f"Overall result: {overall_result} ({'pass' if overall_result == 0 else 'fail'})")
          write_output(test_result=str(overall_result))

          if not data_files:
              print("No coverage data files among the shard artifacts - reporting coverage as unknown, not 0%.")
              write_output(coverage_pct="")
              # overall_result, not a bare 0 - missing coverage data says
              # nothing about whether the tests themselves passed. Exiting 0
              # unconditionally here would report this job (and any required
              # check pointed at it) as green even when a shard's tests
              # actually failed, just because its data file also happened to
              # go missing.
              sys.exit(overall_result)

          subprocess.run(["coverage", "combine", *data_files], check=True)
          include = ",".join(f"*/{m}/*" for m in sorted(modules))
          report = subprocess.run(
              ["coverage", "report", f"--include={include}"], check=False, capture_output=True, text=True
          )
          print(report.stdout)
          subprocess.run(["coverage", "html", f"--include={include}", "-d", "htmlcov"], check=False)
          subprocess.run(["coverage", "json", f"--include={include}", "-o", "coverage.json"], check=False)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(f"## Combined Coverage Report ({len(shard_dirs)} shard(s), {len(modules)} module(s))\n\n")
                  f.write(f"```\n{report.stdout}```\n")

          try:
              with open("coverage.json") as f:
                  pct = round(json.load(f)["totals"]["percent_covered"])
              write_output(coverage_pct=str(pct))
          except Exception as exc:
              print(f"::warning::Could not parse coverage.json ({exc}) - reporting coverage as unknown, not 0%")
              write_output(coverage_pct="")

          # This job's own exit code, not just the test_result *output* above -
          # test_result feeds the Badges job, but a required status check
          # (e.g. an org ruleset) gates on this job's actual conclusion, which
          # was always "success" regardless of overall_result until now. A
          # shard's tests failing has to fail this job too, or nothing
          # required-status-check-based ever blocks on a real test failure.
          sys.exit(overall_result)
          PYEOF

      - name: Upload combined HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-combined-${{ github.run_id }}
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 30
