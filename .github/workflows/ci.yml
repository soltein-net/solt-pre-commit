# =============================================================================
# SOLT PRE-COMMIT - CI/CD Pipeline
# =============================================================================
# Supports Odoo versions: 17.0, 18.0, 19.0
# =============================================================================

name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # LINT & FORMAT
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run lint + format check
        run: ./scripts/lint.sh

  # ───────────────────────────────────────────────────────────────────────────
  # TESTS
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v4
        with:
          # get_current_version() (scripts/setup-repo.py) and setuptools_scm
          # both need `git describe --tags` to actually find a tag - the
          # default shallow fetch-depth: 1 checks out only the tip commit
          # with no tag history reachable at all, so any test importing
          # setup-repo.py fails collection with "No names found, cannot
          # describe anything."
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        id: pytest
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short --cov=solt_pre_commit --cov-report=xml
          else
            echo "No tests directory found, running basic import test"
            python -c "from solt_pre_commit import ChecksOdooModule, SoltConfig, SUPPORTED_ODOO_VERSIONS; print(f'Import OK - Supported versions: {SUPPORTED_ODOO_VERSIONS}')"
          fi

      # Reports THIS matrix leg's own result, separately from the "Self
      # Coverage" job's single non-matrix badge below - so the README can show
      # per-Python-version test status instead of one number that only ever
      # reflected 3.11.
      - name: Report per-version test badge
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GIST_SECRET not provided, skipping test badge update"
            exit 0
          fi
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            MSG="passing"; COLOR="brightgreen"
          else
            MSG="failing"; COLOR="red"
          fi
          BADGE_CONTENT=$(jq -nc --arg l "tests (python ${{ matrix.python-version }})" --arg m "$MSG" --arg c "$COLOR" \
            '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}')
          FILENAME="solt-pre-commit-py${{ matrix.python-version }}-tests.json"
          jq -n --arg f "$FILENAME" --arg c "$BADGE_CONTENT" '{files: {($f): {content: $c}}}' | \
          gh api --method PATCH "/gists/147d543a086f6735d1ffa02172766e86" --input - \
            && echo "Updated tests badge for Python ${{ matrix.python-version }}" \
            || echo "::warning::Could not update test badge (non-fatal)"

  # ───────────────────────────────────────────────────────────────────────────
  # SELF BADGES - solt-pre-commit publishes the same tests/coverage badges to
  # itself that solt-update-check-badges.yml lets every consumer repo publish.
  # A dedicated, non-matrix run rather than reading off the `test` job's
  # matrix outputs - matrix job outputs are last-leg-wins and not reliable to
  # depend on for a single reported number.
  # ───────────────────────────────────────────────────────────────────────────
  self-coverage:
    name: 📊 Self Coverage
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    if: always()
    outputs:
      test_result: ${{ steps.test.outputs.result }}
      coverage_pct: ${{ steps.report.outputs.coverage_pct }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the `test` job above - git describe needs full
          # tag history, not the default shallow checkout.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        id: test
        run: |
          set +e
          pytest tests/ --cov=solt_pre_commit --cov-report=xml --cov-report=json
          RESULT=$?
          set -e
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Coverage percentage
        id: report
        if: always()
        run: |
          if [ -s coverage.json ] && COV=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))" 2>/tmp/coverage_parse_err); then
            echo "coverage_pct=$COV" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not parse coverage.json ($(cat /tmp/coverage_parse_err 2>/dev/null)) - reporting coverage as unknown, not 0%"
            echo "coverage_pct=" >> "$GITHUB_OUTPUT"
          fi

  badges:
    name: 🏷️ Update Self Badges
    needs: [ self-coverage ]
    if: always()
    uses: ./.github/workflows/solt-update-check-badges.yml
    with:
      # Not tied to one Odoo version - "core" labels the badge instead of a
      # version this package itself doesn't have.
      odoo-version: 'core'
      badge-filename-prefix: 'solt-pre-commit'
      test-result: ${{ needs.self-coverage.outputs.test_result }}
      coverage-pct: ${{ needs.self-coverage.outputs.coverage_pct }}
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

  # ───────────────────────────────────────────────────────────────────────────
  # INTEGRATION TEST - Validate sample modules for each Odoo version
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: 🔗 Integration Test (Odoo ${{ matrix.odoo-version }})
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    strategy:
      fail-fast: false
      matrix:
        odoo-version: [ '17.0', '18.0', '19.0' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Create sample Odoo ${{ matrix.odoo-version }} module
        run: |
          mkdir -p test_module
          cat > test_module/__manifest__.py << EOF
          {
              "name": "Test Module",
              "version": "${{ matrix.odoo-version }}.1.0.0",
              "category": "Tools",
              "summary": "Test module for solt-pre-commit (Odoo ${{ matrix.odoo-version }})",
              "depends": ["base"],
              "data": [],
              "installable": True,
              "license": "LGPL-3",
          }
          EOF

          cat > test_module/__init__.py << 'EOF'
          from . import models
          EOF

          mkdir -p test_module/models
          cat > test_module/models/__init__.py << 'EOF'
          from . import test_model
          EOF

          cat > test_module/models/test_model.py << 'EOF'
          from odoo import fields, models

          class TestModel(models.Model):
              """Test model for validation."""

              _name = "test.model"
              _description = "Test Model"

              name = fields.Char(string="Name", required=True)
              active = fields.Boolean(default=True)
              amount = fields.Float(string="Amount", help="The amount value")
          EOF

      - name: Run solt-check-odoo
        run: |
          echo "Testing solt-check-odoo for Odoo ${{ matrix.odoo-version }}..."
          solt-check-odoo test_module --show-info --odoo-version ${{ matrix.odoo-version }} || true

      - name: Test version auto-detection
        run: |
          echo "Testing version auto-detection..."
          DETECTED=$(solt-check-odoo test_module -q 2>&1 | grep -o "Odoo version(s): [0-9.]*" | head -1 || echo "")
          if [ -n "$DETECTED" ]; then
            echo "Detected: $DETECTED"
          fi

      - name: Run solt-check-branch (valid branches)
        run: |
          echo "Testing solt-check-branch with valid branches..."
          # Version + ticket (recommended)
          solt-check-branch "feature/${{ matrix.odoo-version }}-SOLT-123-sample-branch"
          # Version only
          solt-check-branch "fix/${{ matrix.odoo-version }}-correct-bug"
          # Version-type format
          solt-check-branch "${{ matrix.odoo-version }}-hotfix-urgent-fix"
          # Release
          solt-check-branch "release/${{ matrix.odoo-version }}.1.0"
          # Protected branches
          solt-check-branch "main"
          solt-check-branch "${{ matrix.odoo-version }}"

      - name: Test invalid branches (should fail)
        run: |
          echo "Testing invalid branch names (should all fail)..."
          # Missing version
          ! solt-check-branch "feature/add-something"
          # Missing version (has ticket but no version)
          ! solt-check-branch "feature/SOLT-123-something"
          # Invalid format
          ! solt-check-branch "invalid-branch-name"
          echo "All invalid branch tests passed (correctly rejected)"

      # Reports THIS matrix leg's own result - mirrors the "test" job's
      # per-version badge step above, so the README can show per-Odoo-version
      # integration status instead of a static "Odoo 17.0-19.0" label badge.
      # job.status reflects all preceding steps in this job, not just one.
      - name: Report per-version integration badge
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GIST_SECRET not provided, skipping integration badge update"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            MSG="passing"; COLOR="brightgreen"
          else
            MSG="failing"; COLOR="red"
          fi
          BADGE_CONTENT=$(jq -nc --arg l "integration (odoo ${{ matrix.odoo-version }})" --arg m "$MSG" --arg c "$COLOR" \
            '{schemaVersion:1, label:$l, message:$m, color:$c, namedLogo:"github", logoColor:"white"}')
          FILENAME="solt-pre-commit-odoo${{ matrix.odoo-version }}-integration.json"
          jq -n --arg f "$FILENAME" --arg c "$BADGE_CONTENT" '{files: {($f): {content: $c}}}' | \
          gh api --method PATCH "/gists/147d543a086f6735d1ffa02172766e86" --input - \
            && echo "Updated integration badge for Odoo ${{ matrix.odoo-version }}" \
            || echo "::warning::Could not update integration badge (non-fatal)"

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD & PUBLISH
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [ integration ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs full tag history to compute the real
          # version - without it, the built artifact silently falls back to
          # the placeholder fallback_version instead of the actual tag.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ───────────────────────────────────────────────────────────────────────────
  # CREATE RELEASE
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the short tag name (v1.0.1), not the full ref. v1 passed
          # refs/tags/v1.0.1 to the API, producing a malformed URL and a 500.
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
