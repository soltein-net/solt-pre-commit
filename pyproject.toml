[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "solt-pre-commit"
dynamic = ["version"]
description = "Custom pre-commit hooks for Odoo module validation - Soltein (supports Odoo 17.0, 18.0, 19.0)"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Soltein", email = "dev@soltein.mx"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Odoo",
]
dependencies = [
    "lxml>=4.9.0",
    "manifestoo>=1.0.0",
    "packaging>=21.0",
    "polib>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.14.0",
]

[project.scripts]
solt-check-branch = "solt_pre_commit.checks_branch_name:main"
solt-check-odoo = "solt_pre_commit.checks_odoo_module:main"
solt-check-requirements = "solt_pre_commit.checks_requirements:main"
solt-test-changed-modules = "solt_pre_commit.checks_test_changed_modules:main"
solt-test-module = "solt_pre_commit.odoo_test_runner:main"

[project.urls]
Homepage = "https://github.com/soltein-net/solt-pre-commit"
Repository = "https://github.com/soltein-net/solt-pre-commit"
Issues = "https://github.com/soltein-net/solt-pre-commit/issues"

[tool.setuptools_scm]
# Package version is derived from the git tag (e.g. v1.2.0 -> 1.2.0), not a
# hand-edited string here - single source of truth is the tag itself, so
# there's nothing to remember to bump in this file at release time.
# fallback_version applies only if git tag history is unreachable at build
# time (e.g. a malformed checkout) - degrades to an obviously-fake version
# instead of hard-failing the install for every repo pulling this package.
fallback_version = "0.0.0.dev0"

[tool.setuptools]
# src-layout package discovery - previously supplied by setup.py's
# packages=find_packages("src")/package_dir={"": "src"} (removed once
# pyproject.toml's [project] table covered everything setup.py did). The
# old py-modules list here was leftover from a pre-src-layout flat
# structure and pointed at files that no longer exist at the repo root -
# every one of those names is a real submodule under src/solt_pre_commit/
# now, found via packages.find below instead.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["solt_pre_commit"]

[tool.ruff.format]
# Defaults match; explicit so the formatting contract lives in one place.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
